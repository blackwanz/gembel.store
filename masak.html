<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stok Dapur — Gembel AI PIK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,680&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/popup.js"></script>
<style>
  :root{
    --bg:#EEF2F0;
    --surface:#FFFFFF;
    --surface-2:#E3EAE6;
    --border:#D2DBD6;
    --ink:#182220;
    --muted:#5C6864;
    --faint:#8B958F;
    --accent:#1F6F6B;
    --accent-strong:#155451;
    --accent-ink:#F4FBFA;
    --accent-tint:#DCEEEC;
    --fresh:#3E7D4C;
    --fresh-bg:#DFEEE0;
    --soon:#9A6B0E;
    --soon-bg:#F3E6C4;
    --expired:#AE3327;
    --expired-bg:#F5DAD6;
    --shadow:0 1px 2px rgba(24,34,32,.06), 0 8px 24px -12px rgba(24,34,32,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101715; --surface:#1A2321; --surface-2:#212B28; --border:#2E3934;
      --ink:#E8EFEC; --muted:#9FACA6; --faint:#6C7975;
      --accent:#57C4BC; --accent-strong:#7BD6CF; --accent-ink:#0B201E; --accent-tint:#1B302E;
      --fresh:#7FD293; --fresh-bg:#1E3325; --soon:#E8B94E; --soon-bg:#3A2F16;
      --expired:#EA7C6D; --expired-bg:#3C201C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101715; --surface:#1A2321; --surface-2:#212B28; --border:#2E3934;
    --ink:#E8EFEC; --muted:#9FACA6; --faint:#6C7975;
    --accent:#57C4BC; --accent-strong:#7BD6CF; --accent-ink:#0B201E; --accent-tint:#1B302E;
    --fresh:#7FD293; --fresh-bg:#1E3325; --soon:#E8B94E; --soon-bg:#3A2F16;
    --expired:#EA7C6D; --expired-bg:#3C201C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Public Sans', ui-sans-serif, system-ui, sans-serif;font-size:14px;line-height:1.5;}
  a{color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px;}
  h1,h2,h3{font-family:'Fraunces', ui-serif, Georgia, serif;text-wrap:balance;margin:0;}
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace;font-variant-numeric:tabular-nums;}

  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .back-link{font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;}
  .back-link:hover{color:var(--accent);}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .brand-eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px;}
  h1{font-size:30px;font-weight:680;color:var(--ink);}
  .today{color:var(--muted);font-size:13px;margin-top:4px;}
  .summary-chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);}
  .summary-chip .num{font-family:'JetBrains Mono';font-size:22px;font-weight:600;color:var(--expired);}
  .summary-chip .lbl{font-size:12px;color:var(--muted);max-width:140px;line-height:1.35;}

  .kitchen-switcher{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .kitchen-tab{display:flex;align-items:center;gap:7px;font-family:'Public Sans';font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 13px;cursor:pointer;color:var(--muted);}
  .kitchen-tab:hover{border-color:var(--accent);}
  .kitchen-tab.active{background:var(--accent-tint);border-color:var(--accent);color:var(--ink);}
  .role-pill{font-family:'JetBrains Mono';font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;}
  .role-pill.owner{background:var(--accent);color:var(--accent-ink);}
  .role-pill.editor{background:var(--soon-bg);color:var(--soon);}
  .role-pill.viewer{background:var(--surface-2);color:var(--faint);}
  .kitchen-tab-add{font-family:'Public Sans';font-size:13px;font-weight:600;color:var(--faint);background:none;border:1px dashed var(--border);border-radius:12px;padding:8px 13px;cursor:pointer;}
  .kitchen-tab-add:hover{color:var(--accent);border-color:var(--accent);}

  .layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);}
  .side-stack{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px;}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .chip{font-family:'Public Sans';font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;}
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .chip-add{background:none;border:1px dashed var(--border);color:var(--faint);}
  .chip-add:hover{color:var(--accent);border-color:var(--accent);}
  .inline-add{display:flex;gap:6px;align-items:center;}
  .inline-add input{font-family:'Public Sans';font-size:12.5px;border:1px solid var(--accent);border-radius:999px;padding:6px 12px;background:var(--surface-2);color:var(--ink);width:150px;}
  .inline-add button{font-family:'Public Sans';font-size:12px;font-weight:600;border:none;border-radius:999px;padding:7px 12px;cursor:pointer;background:var(--accent);color:var(--accent-ink);}

  .list-panel{padding:18px 18px 8px;position:relative;}
  .list-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
  .list-head h2{font-size:18px;font-weight:600;}
  .list-count{font-size:12px;color:var(--faint);}
  .search-row{position:relative;margin-bottom:14px;}
  .search-row svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;}
  .search-row input{padding-left:32px;background:var(--surface-2);}
  .search-row .clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;padding:2px 6px;display:none;}
  .search-row.has-value .clear-search{display:block;}
  .viewer-note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 12px;margin-bottom:14px;}
  .hint-row{font-size:11.5px;color:var(--faint);margin-bottom:10px;}

  .context-menu{position:fixed;z-index:50;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:6px;display:none;}
  .context-menu.open{display:block;}
  .context-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;font-family:'Public Sans';font-size:13px;font-weight:600;color:var(--ink);padding:9px 10px;border-radius:7px;cursor:pointer;}
  .context-menu button:hover{background:var(--accent-tint);}
  .context-menu button:disabled{color:var(--faint);cursor:default;}
  .context-menu button:disabled:hover{background:none;}
  .context-menu .cm-loc{font-size:11px;color:var(--faint);font-weight:500;padding:6px 10px 2px;}

  .row{display:grid;grid-template-columns:5px 1fr auto auto;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);}
  .row.view-only{grid-template-columns:5px 1fr auto;}
  .row:last-of-type{border-bottom:none;}
  .stripe{align-self:stretch;border-radius:4px;background:var(--faint);}
  .row.danger .stripe{background:var(--expired);}
  .row.warning .stripe{background:var(--soon);}
  .row.ok .stripe{background:var(--fresh);}
  .item-main .name{font-weight:600;font-size:14.5px;}
  .item-main .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
  .item-main .meta .dot{color:var(--faint);}
  .badge{font-family:'JetBrains Mono';font-size:12px;font-weight:600;white-space:nowrap;padding:5px 10px;border-radius:8px;text-align:center;min-width:108px;}
  .row.danger .badge{color:var(--expired);background:var(--expired-bg);}
  .row.warning .badge{color:var(--soon);background:var(--soon-bg);}
  .row.ok .badge{color:var(--fresh);background:var(--fresh-bg);}
  .row-actions{display:flex;gap:6px;}
  .btn{font-family:'Public Sans';font-weight:600;font-size:12.5px;cursor:pointer;border-radius:9px;padding:7px 12px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);transition:filter .12s;}
  .btn:hover{filter:brightness(0.96);}
  :root[data-theme="dark"] .btn:hover{filter:brightness(1.15);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:hover{filter:brightness(1.15);}}
  .btn.ghost{background:transparent;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .empty-list{padding:30px 10px;text-align:center;color:var(--faint);font-size:13px;}

  .add-panel{padding:16px 18px 18px;margin-top:16px;}
  .add-panel summary{cursor:pointer;font-family:'Fraunces';font-size:16px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;}
  .add-panel summary::-webkit-details-marker{display:none;}
  .add-panel summary .plus{font-family:'JetBrains Mono';color:var(--accent-ink);background:var(--accent);width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;}
  .add-panel[open] summary .plus{background:var(--surface-2);color:var(--muted);}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
  @media (max-width:700px){.form-grid{grid-template-columns:1fr 1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.span-2{grid-column:span 2;}
  .field label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;}
  input,select{font-family:'Public Sans';font-size:13.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;width:100%;}
  .qty-row{display:flex;gap:6px;}
  .qty-row input{flex:1.2;}
  .qty-row select{flex:1;}
  .expiry-preview{font-size:12px;color:var(--muted);margin-top:2px;}
  .expiry-preview .mono{color:var(--ink);font-weight:600;}
  .form-foot{display:flex;justify-content:flex-end;margin-top:14px;}

  .plan-panel{padding:18px;}
  .plan-panel h2{font-size:17px;font-weight:600;margin-bottom:3px;}
  .plan-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .plan-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
  .plan-item:last-child{border-bottom:none;}
  .plan-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .plan-item.danger .plan-dot{background:var(--expired);}
  .plan-item.warning .plan-dot{background:var(--soon);}
  .plan-item .t-name{font-weight:600;font-size:13.5px;}
  .plan-item .t-note{font-size:12px;color:var(--muted);margin-top:2px;}
  .plan-empty{font-size:13px;color:var(--faint);padding:6px 0;}

  .members-panel{padding:18px;}
  .members-panel h2{font-size:17px;font-weight:600;margin-bottom:3px;}
  .plan-sub2{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .member-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .member-row:last-of-type{border-bottom:none;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-tint);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  :root[data-theme="dark"] .avatar{color:var(--accent);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .avatar{color:var(--accent);}}
  .member-name{font-weight:600;font-size:13px;flex:1;}
  .member-remove{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
  .member-remove:hover{color:var(--expired);}
  .invite-box{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .invite-fields{display:flex;flex-direction:column;gap:8px;}
  .invite-fields .row2{display:flex;gap:8px;}
  .invite-code{margin-top:10px;background:var(--accent-tint);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink);}
  .invite-code .code{font-family:'JetBrains Mono';font-weight:600;font-size:14px;color:var(--accent-strong);}
  :root[data-theme="dark"] .invite-code .code{color:var(--accent);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .invite-code .code{color:var(--accent);}}
  .pending-code{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:5px 0;}
  .pending-code .mono{color:var(--ink);font-weight:600;}

  .join-box{margin-top:14px;}
  .join-box summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);list-style:none;}
  .join-box summary::-webkit-details-marker{display:none;}
  .join-box summary:hover{color:var(--accent);}
  .join-fields{display:flex;gap:8px;margin-top:10px;}

  .onboarding{padding:40px 24px;text-align:center;max-width:420px;margin:60px auto;}
  .onboarding h2{font-size:22px;margin-bottom:8px;}
  .onboarding p{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
  .onboarding input{margin-bottom:12px;}

  .loading-note{padding:40px;text-align:center;color:var(--faint);font-size:13px;}
  footer.note{margin-top:20px;font-size:11.5px;color:var(--faint);text-align:center;}
</style>
</head>
<body>

<div class="wrap" id="app-root">
  <div class="top-nav">
    <a class="back-link" href="dashboard.html">&larr; Dashboard</a>
  </div>
  <div class="loading-note" id="loading-note">Memuat dapur lo...</div>
</div>

<script>
(function(){
  const DAY_MS = 86400000;
  const DEFAULT_LOCATIONS = ['Kulkas','Freezer','Rak Bumbu','Meja'];
  const ROLE_LABEL = { owner:'Pemilik', editor:'Bisa Edit', viewer:'Lihat Aja' };
  const SHELF_LIFE = {
    'daun bawang':3,'seledri':4,'kemangi':3,'kangkung':2,'bayam':2,'sawi':3,'kol':10,
    'tomat':5,'wortel':14,'kentang':21,'timun':5,'terong':5,'buncis':4,
    'cabai merah':7,'cabai rawit':7,'bawang merah':30,'bawang putih':30,'jahe':21,
    'ayam':2,'daging sapi':3,'ikan':2,'udang':2,'tahu':4,'tempe':5,'telur':21,
    'susu cair':5,'keju':14,'yogurt':14,'mentega':60,'santan':2,
    'nasi':1,'jamur':3,'kecap manis':180,'saus sambal':90
  };
  const COOK_HINTS = {
    'Sayur':'Tumis cepat atau masuk ke sup sebelum layu.',
    'Protein':'Olah jadi lauk utama hari ini.',
    'Dairy & Telur':'Pakai buat masak atau minum langsung.',
    'Bumbu':'Giling/haluskan sekarang biar gak kering.',
    'Buah':'Makan langsung atau jus sebelum lembek.',
    'Karbohidrat':'Masak dan habiskan, jangan disimpan ulang.',
    'Lainnya':'Cek kondisinya sebelum kelewat lama.'
  };

  function todayStart(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
  function fmtDate(d){ return d.toLocaleDateString('id-ID',{ day:'numeric', month:'short' }); }
  function isoDate(d){ return d.toISOString().slice(0,10); }
  function initials(name){ return String(name || '?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function randomCode(){ return 'DAPUR-' + Math.random().toString(36).slice(2,7).toUpperCase(); }
  function daysLeft(item){
    const exp = new Date(item.bought_at);
    exp.setDate(exp.getDate() + Number(item.shelf_life_days));
    return Math.round((exp.getTime() - todayStart().getTime()) / DAY_MS);
  }
  function statusOf(dl){ if(dl<=1) return 'danger'; if(dl<=3) return 'warning'; return 'ok'; }
  function badgeText(dl){
    if(dl<0) return `Basi ${Math.abs(dl)}h lalu`;
    if(dl===0) return 'Habiskan hari ini';
    if(dl===1) return 'Habiskan besok';
    return `${dl} hari lagi`;
  }

  let CURRENT_USER = null;
  let KITCHENS = [];        // [{id, name, role}]
  let activeKitchenId = null;
  let ACTIVE = { locations:[], items:[], members:[], invites:[] };
  let activeLocation = 'Semua';
  let searchTerm = '';
  let addingLocation = false;
  let addingKitchen = false;
  let joiningCode = false;
  let inviteResult = null;
  let ctxMenuLocation = null;

  function activeRole(){ const k = KITCHENS.find(k=>k.id===activeKitchenId); return k ? k.role : 'viewer'; }
  function canEdit(){ const r = activeRole(); return r==='owner' || r==='editor'; }
  function isOwner(){ return activeRole() === 'owner'; }

  async function fetchKitchens(){
    const { data, error } = await supabase
      .from('kitchen_members')
      .select('role, kitchens(id, name)')
      .eq('user_id', CURRENT_USER.id);
    if(error){ await gembelAlert('Gagal muat dapur: ' + error.message); return []; }
    return (data || [])
      .filter(row => row.kitchens)
      .map(row => ({ id: row.kitchens.id, name: row.kitchens.name, role: row.role }));
  }

  async function createKitchen(name){
    const { data: kitchen, error: kErr } = await supabase
      .from('kitchens').insert({ name, owner_id: CURRENT_USER.id }).select().single();
    if(kErr){ await gembelAlert('Gagal bikin dapur: ' + kErr.message); return null; }
    const { error: mErr } = await supabase
      .from('kitchen_members').insert({ kitchen_id: kitchen.id, user_id: CURRENT_USER.id, role:'owner' });
    if(mErr){ await gembelAlert('Gagal daftarin lo sebagai pemilik: ' + mErr.message); return null; }
    const { error: lErr } = await supabase
      .from('kitchen_locations').insert(DEFAULT_LOCATIONS.map(name => ({ kitchen_id: kitchen.id, name })));
    if(lErr){ await gembelAlert('Dapur dibuat, tapi lokasi default gagal: ' + lErr.message); }
    return kitchen;
  }

  async function loadActiveKitchenDetail(){
    const kid = activeKitchenId;
    const [locRes, itemRes, memberRes, inviteRes] = await Promise.all([
      supabase.from('kitchen_locations').select('*').eq('kitchen_id', kid).order('created_at'),
      supabase.from('stock_items').select('*').eq('kitchen_id', kid),
      supabase.from('kitchen_members').select('*').eq('kitchen_id', kid),
      isOwner()
        ? supabase.from('kitchen_invites').select('*').eq('kitchen_id', kid).is('accepted_by', null).gt('expires_at', new Date().toISOString())
        : Promise.resolve({ data: [] }),
    ]);
    ACTIVE.locations = (locRes.data || []).map(l => l.name);
    ACTIVE.items = itemRes.data || [];
    ACTIVE.invites = inviteRes.data || [];

    const members = memberRes.data || [];
    const userIds = members.map(m => m.user_id);
    let profiles = {};
    if(userIds.length){
      const { data: profRows } = await supabase.from('profiles').select('id, full_name, email').in('id', userIds);
      (profRows || []).forEach(p => { profiles[p.id] = p; });
    }
    ACTIVE.members = members.map(m => ({
      id: m.id, user_id: m.user_id, role: m.role,
      name: m.user_id === CURRENT_USER.id ? 'Kamu' : (profiles[m.user_id]?.full_name || profiles[m.user_id]?.email || 'Anggota'),
    }));
  }

  function render(){
    const root = document.getElementById('app-root');
    if(KITCHENS.length === 0){ renderOnboarding(root); return; }
    if(!document.getElementById('kitchen-switcher')) renderShell(root);
    renderKitchenSwitcher();
    renderFilters();
    renderList();
    renderPlan();
    renderSummary();
    renderMembers();
    syncLocationSelect();
    document.getElementById('add-details').style.display = canEdit() ? '' : 'none';
  }

  function renderOnboarding(root){
    root.innerHTML = `
      <div class="top-nav"><a class="back-link" href="dashboard.html">&larr; Dashboard</a></div>
      <div class="panel onboarding">
        <div class="brand-eyebrow">Warung Kode Digital &middot; Dapur</div>
        <h2>Bikin dapur pertama lo</h2>
        <p>Satu dapur = satu tempat tinggal (kos, rumah, dll). Lo bisa punya lebih dari satu, dan undang orang lain buat ikut ngelola stoknya.</p>
        <input type="text" id="onboard-name" placeholder="mis. Kosan Barokah">
        <button class="btn primary" id="onboard-btn" style="width:100%;">Buat Dapur</button>
      </div>`;
    document.getElementById('onboard-btn').addEventListener('click', async () => {
      const input = document.getElementById('onboard-name');
      const name = input.value.trim();
      if(!name){ input.focus(); return; }
      const btn = document.getElementById('onboard-btn');
      btn.disabled = true; btn.textContent = 'Bikin dapur...';
      const kitchen = await createKitchen(name);
      if(!kitchen){ btn.disabled = false; btn.textContent = 'Buat Dapur'; return; }
      await bootAfterKitchensChange(kitchen.id);
    });
  }

  function renderShell(root){
    root.innerHTML = `
      <div class="top-nav"><a class="back-link" href="dashboard.html">&larr; Dashboard</a></div>
      <header>
        <div>
          <div class="brand-eyebrow">Warung Kode Digital &middot; Dapur</div>
          <h1>Stok Dapur</h1>
          <div class="today" id="today-line"></div>
        </div>
        <div class="summary-chip">
          <div class="num" id="urgent-count">0</div>
          <div class="lbl">bahan butuh dimasak dalam 3 hari</div>
        </div>
      </header>
      <div class="kitchen-switcher" id="kitchen-switcher"></div>
      <div class="layout">
        <div>
          <div class="filters" id="location-filters"></div>
          <div class="panel list-panel">
            <div class="list-head">
              <h2 id="list-title">Isi Dapur</h2>
              <div class="list-count" id="list-count"></div>
            </div>
            <div class="search-row" id="search-row">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="search-input" placeholder="Cari bahan...">
              <button type="button" class="clear-search" id="clear-search">&times;</button>
            </div>
            <div class="hint-row">Klik kanan di area ini buat tambah stok cepat.</div>
            <div id="viewer-note-slot"></div>
            <div id="stock-list"></div>
          </div>
          <details class="panel add-panel" id="add-details">
            <summary>Tambah stok baru <span class="plus">+</span></summary>
            <div class="form-grid">
              <div class="field span-2">
                <label for="f-name">Nama bahan</label>
                <input id="f-name" list="bahan-list" placeholder="mis. Daun bawang" autocomplete="off">
                <datalist id="bahan-list"></datalist>
              </div>
              <div class="field">
                <label for="f-category">Kategori</label>
                <select id="f-category">
                  <option>Sayur</option><option>Protein</option><option>Dairy &amp; Telur</option>
                  <option>Bumbu</option><option>Buah</option><option>Karbohidrat</option><option>Lainnya</option>
                </select>
              </div>
              <div class="field">
                <label for="f-location">Lokasi</label>
                <select id="f-location"></select>
              </div>
              <div class="field">
                <label for="f-qty">Jumlah</label>
                <div class="qty-row">
                  <input id="f-qty" type="number" min="0" step="0.5" value="1">
                  <select id="f-unit">
                    <option>ikat</option><option>butir</option><option>kg</option><option>gram</option>
                    <option>liter</option><option>papan</option><option>buah</option><option>bungkus</option><option>siung</option>
                  </select>
                </div>
              </div>
              <div class="field"><label for="f-bought">Tanggal beli</label><input id="f-bought" type="date"></div>
              <div class="field"><label for="f-shelf">Umur simpan (hari)</label><input id="f-shelf" type="number" min="0" value="7"></div>
              <div class="field"><label>&nbsp;</label><div class="expiry-preview">Basi sekitar<br><span class="mono" id="expiry-preview">-</span></div></div>
            </div>
            <div class="form-foot"><button class="btn primary" id="add-btn">Simpan ke stok</button></div>
          </details>
          <footer class="note">Data tersambung ke akun lo &mdash; anggota dapur lain lihat perubahan yang sama.</footer>
        </div>
        <div class="side-stack">
          <div class="panel plan-panel">
            <h2>Rencana Masak</h2>
            <div class="plan-sub">Urutan pakai biar gak kebuang.</div>
            <div id="plan-list"></div>
          </div>
          <div class="panel members-panel">
            <h2>Anggota Dapur</h2>
            <div class="plan-sub2" id="members-sub"></div>
            <div id="member-list"></div>
            <div id="invite-slot"></div>
          </div>
        </div>
      </div>
      <div class="context-menu" id="context-menu"></div>
    `;

    document.getElementById('today-line').textContent =
      'Hari ini ' + new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    wireStaticHandlers();
  }

  // ---- Kitchen switcher ----
  function renderKitchenSwitcher(){
    const box = document.getElementById('kitchen-switcher');
    const tabs = KITCHENS.map(k => `
      <button type="button" class="kitchen-tab${k.id===activeKitchenId?' active':''}" data-kid="${k.id}">
        ${escapeHtml(k.name)} <span class="role-pill ${k.role}">${ROLE_LABEL[k.role]}</span>
      </button>`).join('');

    let extra;
    if(addingKitchen){
      extra = `<span class="inline-add">
        <input type="text" id="new-kitchen-input" placeholder="Nama dapur baru">
        <button type="button" id="new-kitchen-confirm">Buat</button>
      </span>`;
    } else if(joiningCode){
      extra = `<span class="inline-add">
        <input type="text" id="join-code-input" placeholder="Kode undangan, mis. DAPUR-7F2K">
        <button type="button" id="join-code-confirm">Gabung</button>
      </span>`;
    } else {
      extra = `<button type="button" class="kitchen-tab-add" id="add-kitchen-btn">+ Dapur baru</button>
                <button type="button" class="kitchen-tab-add" id="join-kitchen-btn">+ Gabung pakai kode</button>`;
    }
    box.innerHTML = tabs + extra;

    box.querySelectorAll('.kitchen-tab').forEach(btn=>{
      btn.addEventListener('click', async () => {
        activeKitchenId = btn.dataset.kid;
        activeLocation = 'Semua'; searchTerm = ''; inviteResult = null;
        document.getElementById('loading-note') && (document.getElementById('loading-note').style.display='none');
        await loadActiveKitchenDetail();
        render();
      });
    });
    const addBtn = document.getElementById('add-kitchen-btn');
    if(addBtn) addBtn.addEventListener('click', ()=>{ addingKitchen = true; renderKitchenSwitcher(); });
    const joinBtn = document.getElementById('join-kitchen-btn');
    if(joinBtn) joinBtn.addEventListener('click', ()=>{ joiningCode = true; renderKitchenSwitcher(); });

    const newKConfirm = document.getElementById('new-kitchen-confirm');
    if(newKConfirm){
      const commit = async () => {
        const val = document.getElementById('new-kitchen-input').value.trim();
        if(!val) return;
        newKConfirm.disabled = true;
        const kitchen = await createKitchen(val);
        addingKitchen = false;
        if(kitchen){ await bootAfterKitchensChange(kitchen.id); } else { renderKitchenSwitcher(); }
      };
      newKConfirm.addEventListener('click', commit);
      document.getElementById('new-kitchen-input').addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); });
    }
    const joinConfirm = document.getElementById('join-code-confirm');
    if(joinConfirm){
      const commit = async () => {
        const codeInput = document.getElementById('join-code-input');
        const code = codeInput.value.trim().toUpperCase();
        if(!code) return;
        joinConfirm.disabled = true;
        const joinedKitchenId = await redeemInvite(code);
        joiningCode = false;
        if(joinedKitchenId){ await bootAfterKitchensChange(joinedKitchenId); } else { renderKitchenSwitcher(); }
      };
      joinConfirm.addEventListener('click', commit);
      document.getElementById('join-code-input').addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); });
    }
  }

  async function redeemInvite(code){
    const { data: invite, error } = await supabase
      .from('kitchen_invites').select('id, kitchen_id, role, accepted_by, expires_at')
      .eq('code', code).maybeSingle();
    if(error || !invite){ await gembelAlert('Kode gak ketemu. Cek lagi ejaannya ya.'); return null; }
    if(invite.accepted_by || new Date(invite.expires_at) < new Date()){
      await gembelAlert('Kode ini udah dipakai atau kadaluarsa.'); return null;
    }
    const { error: mErr } = await supabase
      .from('kitchen_members').insert({ kitchen_id: invite.kitchen_id, user_id: CURRENT_USER.id, role: invite.role });
    if(mErr){ await gembelAlert('Gagal gabung: ' + mErr.message); return null; }
    await supabase.from('kitchen_invites').update({ accepted_by: CURRENT_USER.id, accepted_at: new Date().toISOString() }).eq('id', invite.id);
    return invite.kitchen_id;
  }

  async function bootAfterKitchensChange(preferKitchenId){
    KITCHENS = await fetchKitchens();
    activeKitchenId = preferKitchenId && KITCHENS.some(k=>k.id===preferKitchenId) ? preferKitchenId : (KITCHENS[0]?.id || null);
    if(activeKitchenId) await loadActiveKitchenDetail();
    render();
  }

  // ---- Location filter chips ----
  function renderFilters(){
    const box = document.getElementById('location-filters');
    const locs = ['Semua', ...ACTIVE.locations];
    let html = locs.map(l=>{
      const count = l==='Semua' ? ACTIVE.items.length : ACTIVE.items.filter(i=>i.location===l).length;
      return `<button type="button" class="chip${activeLocation===l?' active':''}" data-loc="${escapeHtml(l)}">${escapeHtml(l)} <span class="mono" style="opacity:.65">${count}</span></button>`;
    }).join('');

    if(canEdit()){
      if(addingLocation){
        html += `<span class="inline-add">
          <input type="text" id="new-loc-input" placeholder="mis. Toples Cemilan">
          <button type="button" id="new-loc-confirm">Tambah</button>
        </span>`;
      } else {
        html += `<button type="button" class="chip chip-add" id="add-loc-btn">+ Tempat baru</button>`;
      }
    }
    box.innerHTML = html;

    box.querySelectorAll('.chip[data-loc]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeLocation = btn.dataset.loc; render(); });
    });
    const addBtn = document.getElementById('add-loc-btn');
    if(addBtn) addBtn.addEventListener('click', ()=>{ addingLocation = true; renderFilters(); });
    const confirmBtn = document.getElementById('new-loc-confirm');
    if(confirmBtn){
      const commit = async () => {
        const val = document.getElementById('new-loc-input').value.trim();
        addingLocation = false;
        if(val && !ACTIVE.locations.includes(val)){
          const { error } = await supabase.from('kitchen_locations').insert({ kitchen_id: activeKitchenId, name: val });
          if(error){ await gembelAlert('Gagal nambah tempat: ' + error.message); }
          else ACTIVE.locations.push(val);
        }
        render();
      };
      confirmBtn.addEventListener('click', commit);
      document.getElementById('new-loc-input').addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); });
    }
  }

  function syncLocationSelect(){
    const sel = document.getElementById('f-location');
    sel.innerHTML = ACTIVE.locations.map(l=>`<option>${escapeHtml(l)}</option>`).join('');
  }

  // ---- Stock list ----
  function visibleItems(){
    let visible = ACTIVE.items.filter(i => activeLocation==='Semua' || i.location===activeLocation);
    if(searchTerm) visible = visible.filter(i => i.name.toLowerCase().includes(searchTerm.toLowerCase()));
    return visible.slice().sort((a,b)=> daysLeft(a) - daysLeft(b));
  }

  function renderList(){
    const k = KITCHENS.find(k=>k.id===activeKitchenId);
    document.getElementById('list-title').textContent = 'Isi Dapur — ' + k.name;
    const list = document.getElementById('stock-list');
    const countEl = document.getElementById('list-count');
    const noteSlot = document.getElementById('viewer-note-slot');
    const editable = canEdit();

    noteSlot.innerHTML = editable ? '' :
      `<div class="viewer-note">Kamu diundang sebagai <strong>Lihat Aja</strong> di dapur ini — bisa liat stok, gak bisa nambah/hapus.</div>`;

    const visible = visibleItems();
    countEl.textContent = visible.length + ' bahan';

    if(visible.length === 0){
      list.innerHTML = `<div class="empty-list">${searchTerm ? 'Gak ada bahan yang cocok sama pencarian.' : 'Belum ada stok di sini.'}</div>`;
      return;
    }

    list.innerHTML = visible.map(item=>{
      const dl = daysLeft(item);
      const st = statusOf(dl);
      const qty = Number(item.qty) % 1 === 0 ? Number(item.qty) : Number(item.qty).toFixed(1);
      return `
      <div class="row ${st}${editable?'':' view-only'}" data-id="${item.id}">
        <div class="stripe"></div>
        <div class="item-main">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="meta">
            <span>${qty} ${escapeHtml(item.unit)}</span><span class="dot">&middot;</span>
            <span>${escapeHtml(item.location)}</span><span class="dot">&middot;</span>
            <span>beli ${fmtDate(new Date(item.bought_at))}</span>
          </div>
        </div>
        <div class="badge">${badgeText(dl)}</div>
        ${editable ? `
        <div class="row-actions">
          <button type="button" class="btn ghost" data-action="remove" data-id="${item.id}">Habis dipakai</button>
          <button type="button" class="btn ghost" data-action="remove" data-id="${item.id}">Buang</button>
        </div>` : ''}
      </div>`;
    }).join('');

    list.querySelectorAll('[data-action="remove"]').forEach(btn=>{
      btn.addEventListener('click', async () => {
        btn.closest('.row').style.opacity = '.5';
        const { error } = await supabase.from('stock_items').delete().eq('id', btn.dataset.id);
        if(error){ await gembelAlert('Gagal hapus: ' + error.message); }
        ACTIVE.items = ACTIVE.items.filter(i=>i.id !== btn.dataset.id);
        render();
      });
    });
  }

  function renderPlan(){
    const box = document.getElementById('plan-list');
    const urgent = ACTIVE.items.map(i=>({ item:i, dl: daysLeft(i) })).filter(x=>x.dl<=3).sort((a,b)=>a.dl-b.dl).slice(0,5);
    if(urgent.length === 0){ box.innerHTML = `<div class="plan-empty">Aman — gak ada bahan yang buru-buru harus dimasak.</div>`; return; }
    box.innerHTML = urgent.map(({item,dl})=>{
      const st = statusOf(dl);
      const hint = COOK_HINTS[item.category] || COOK_HINTS['Lainnya'];
      return `
      <div class="plan-item ${st}">
        <div class="plan-dot"></div>
        <div>
          <div class="t-name">${escapeHtml(item.name)} <span class="mono" style="font-size:11.5px;color:var(--muted);font-weight:500;">(${badgeText(dl)})</span></div>
          <div class="t-note">${hint}</div>
        </div>
      </div>`;
    }).join('');
  }

  function renderSummary(){
    document.getElementById('urgent-count').textContent = ACTIVE.items.filter(i=>daysLeft(i)<=3).length;
  }

  // ---- Members & invite ----
  function renderMembers(){
    document.getElementById('members-sub').textContent = ACTIVE.members.length + ' orang punya akses ke dapur ini.';
    const list = document.getElementById('member-list');
    list.innerHTML = ACTIVE.members.map(m=>`
      <div class="member-row">
        <div class="avatar">${initials(m.name)}</div>
        <div class="member-name">${escapeHtml(m.name)}</div>
        <span class="role-pill ${m.role}">${ROLE_LABEL[m.role]}</span>
        ${isOwner() && m.role !== 'owner' ? `<button type="button" class="member-remove" data-mid="${m.id}" title="Keluarkan dari dapur">&times;</button>` : ''}
      </div>`).join('');
    list.querySelectorAll('.member-remove').forEach(btn=>{
      btn.addEventListener('click', async () => {
        const { error } = await supabase.from('kitchen_members').delete().eq('id', btn.dataset.mid);
        if(error){ await gembelAlert('Gagal keluarin anggota: ' + error.message); return; }
        ACTIVE.members = ACTIVE.members.filter(m=>m.id !== btn.dataset.mid);
        renderMembers();
      });
    });

    const inviteSlot = document.getElementById('invite-slot');
    if(!isOwner()){ inviteSlot.innerHTML = ''; return; }

    const pendingHtml = ACTIVE.invites.map(inv => `
      <div class="pending-code">
        <span>Kode ${ROLE_LABEL[inv.role]} <span class="mono">${inv.code}</span></span>
      </div>`).join('');

    inviteSlot.innerHTML = `
      <div class="invite-box">
        ${pendingHtml}
        <div class="invite-fields" style="margin-top:${pendingHtml ? '10px' : '0'};">
          <select id="invite-role" style="flex:1;">
            <option value="editor">Bisa Nambah &amp; Edit</option>
            <option value="viewer">Lihat Aja</option>
          </select>
          <button type="button" class="btn primary" id="invite-btn">Buat Kode Undangan</button>
        </div>
        ${inviteResult ? `<div class="invite-code">Kode: <span class="code">${inviteResult}</span><br>Bagikan ke orangnya, dia masukin lewat "+ Gabung pakai kode".</div>` : ''}
      </div>`;

    document.getElementById('invite-btn').addEventListener('click', async () => {
      const role = document.getElementById('invite-role').value;
      const code = randomCode();
      const { error } = await supabase.from('kitchen_invites').insert({ kitchen_id: activeKitchenId, code, role, created_by: CURRENT_USER.id });
      if(error){ await gembelAlert('Gagal bikin kode: ' + error.message); return; }
      inviteResult = code;
      ACTIVE.invites.push({ code, role });
      renderMembers();
    });
  }

  // ---- Add-stock form ----
  function wireStaticHandlers(){
    const nameInput = document.getElementById('f-name');
    const shelfInput = document.getElementById('f-shelf');
    const boughtInput = document.getElementById('f-bought');
    const qtyInput = document.getElementById('f-qty');
    const unitSelect = document.getElementById('f-unit');
    const categorySelect = document.getElementById('f-category');
    const locationSelect = document.getElementById('f-location');
    const preview = document.getElementById('expiry-preview');

    document.getElementById('bahan-list').innerHTML =
      Object.keys(SHELF_LIFE).map(n=>`<option value="${n.replace(/\b\w/g,c=>c.toUpperCase())}">`).join('');
    boughtInput.value = isoDate(new Date());

    function suggestShelfLife(){
      const key = nameInput.value.trim().toLowerCase();
      if(SHELF_LIFE[key] != null) shelfInput.value = SHELF_LIFE[key];
      updatePreview();
    }
    function updatePreview(){
      const bought = boughtInput.value ? new Date(boughtInput.value) : new Date();
      const shelf = Number(shelfInput.value || 0);
      const exp = new Date(bought); exp.setDate(exp.getDate() + shelf);
      preview.innerHTML = `<span class="mono">${fmtDate(exp)}</span>`;
    }
    nameInput.addEventListener('change', suggestShelfLife);
    nameInput.addEventListener('blur', suggestShelfLife);
    shelfInput.addEventListener('input', updatePreview);
    boughtInput.addEventListener('input', updatePreview);
    updatePreview();

    async function submitAdd(prefillLocation){
      if(!canEdit()) return;
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      const addBtn = document.getElementById('add-btn');
      addBtn.disabled = true; addBtn.textContent = 'Nyimpen...';
      const { data, error } = await supabase.from('stock_items').insert({
        kitchen_id: activeKitchenId,
        name,
        category: categorySelect.value,
        location: prefillLocation || locationSelect.value,
        qty: Number(qtyInput.value || 1),
        unit: unitSelect.value,
        bought_at: boughtInput.value || isoDate(new Date()),
        shelf_life_days: Number(shelfInput.value || 7),
        created_by: CURRENT_USER.id,
      }).select().single();
      addBtn.disabled = false; addBtn.textContent = 'Simpan ke stok';
      if(error){ await gembelAlert('Gagal nyimpen: ' + error.message); return; }
      ACTIVE.items.push(data);
      nameInput.value = ''; qtyInput.value = 1; shelfInput.value = 7; boughtInput.value = isoDate(new Date());
      updatePreview();
      document.getElementById('add-details').open = false;
      activeLocation = data.location;
      render();
    }
    document.getElementById('add-btn').addEventListener('click', () => submitAdd(null));

    // ---- Search ----
    const searchInput = document.getElementById('search-input');
    const searchRow = document.getElementById('search-row');
    searchInput.addEventListener('input', () => {
      searchTerm = searchInput.value;
      searchRow.classList.toggle('has-value', !!searchTerm);
      renderList();
    });
    document.getElementById('clear-search').addEventListener('click', () => {
      searchTerm = ''; searchInput.value = ''; searchRow.classList.remove('has-value'); renderList();
    });

    // ---- Right-click "tambah stok di sini" ----
    const menu = document.getElementById('context-menu');
    function closeMenu(){ menu.classList.remove('open'); }
    document.getElementById('stock-list').parentElement.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const menuLoc = activeLocation !== 'Semua' ? activeLocation : (ACTIVE.locations[0] || null);
      ctxMenuLocation = menuLoc;
      const editable = canEdit();
      menu.innerHTML = editable
        ? `<div class="cm-loc">Tambah ke: ${escapeHtml(menuLoc || '-')}</div>
           <button type="button" id="cm-add">+ Tambah stok di sini</button>`
        : `<button type="button" disabled>Kamu cuma bisa lihat dapur ini</button>`;
      const x = Math.min(e.clientX, window.innerWidth - 220);
      const y = Math.min(e.clientY, window.innerHeight - 100);
      menu.style.left = x + 'px'; menu.style.top = y + 'px';
      menu.classList.add('open');
      const addBtn = document.getElementById('cm-add');
      if(addBtn) addBtn.addEventListener('click', () => {
        closeMenu();
        document.getElementById('add-details').open = true;
        document.getElementById('add-details').scrollIntoView({ behavior:'smooth', block:'center' });
        if(ctxMenuLocation) locationSelect.value = ctxMenuLocation;
        nameInput.focus();
      });
    });
    document.addEventListener('click', (e) => { if(!menu.contains(e.target)) closeMenu(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeMenu(); });
    document.addEventListener('scroll', closeMenu, true);
  }

  // ---- Bootstrap ----
  document.addEventListener('DOMContentLoaded', async () => {
    const authCtx = await requireAuth('index.html');
    if(!authCtx) return;
    CURRENT_USER = authCtx.user;
    await bootAfterKitchensChange(null);
  });
})();
</script>
</body>
</html>
