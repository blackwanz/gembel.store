  // ================================================================ DATA (import + settings)
  function renderData(){
    const since = new Date(); since.setMonth(since.getMonth() - 1, 1);
    let h = `<div class="panel"><div class="panel-head"><h2>📥 Import data</h2></div><div class="panel-body">
      <div id="drop" class="drop"><b>Drop file di sini</b> atau klik buat pilih<br><span class="faint">.zip (export Strava) · .gpx · .tcx · .fit · .fit.gz · .csv (Mi Fitness / Zepp Life / Strava) · .json (Google Maps Timeline)</span></div>
      <input type="file" id="file" multiple accept=".zip,.gpx,.tcx,.fit,.gz,.csv,.json" style="display:none">
      <div class="row" style="margin-top:10px"><label class="faint" for="since">Ambil aktivitas sejak</label><input class="in" type="date" id="since" style="width:auto" value="${ymd(since)}"></div>
      <div id="imp-status" class="muted" style="margin-top:10px"></div>
      <div id="imp-preview"></div>
    </div></div>`;

    h += `<div class="panel"><div class="panel-head"><h2>❓ Cara ambil datanya</h2></div><div class="panel-body">
      <details class="guide" open><summary>🟧 Strava — paling lengkap (ada rute GPS)</summary><ol>
        <li><b>Semua sekaligus:</b> buka strava.com di browser (bukan app) → foto profil → <b>Settings → My Account → Download or Delete Your Account → Get Started → Request Your Archive</b>.</li>
        <li>Link zip dikirim ke email (bisa beberapa jam). Upload zip-nya langsung ke sini, gak usah di-extract.</li>
        <li><b>Satu-satu (lebih cepat):</b> buka aktivitas di strava.com → tombol <b>⋯</b> → <b>Export GPX</b> (atau Export Original). Upload file-nya.</li>
        <li>Naik motor: rekam di Strava sebagai <b>Ride</b> (set <i>Only You</i> biar gak muncul di feed) — Jejak otomatis kenalin itu motor dari speed-nya.</li>
      </ol></details>
      <details class="guide"><summary>⌚ Mi Band (Mi Fitness / Zepp Life)</summary><ol>
        <li><b>Cara terbaik:</b> sambungin ke Strava — Mi Fitness: <b>Profil → Third-party data → Strava</b>; Zepp Life: <b>Profil → Tambah akun → Strava</b>. Semua olahraga Mi Band otomatis masuk Strava lengkap sama rutenya, terus ambil dari Strava.</li>
        <li><b>Export langsung:</b> Mi Fitness → Profil → Settings → <b>Privacy / Manage your data → Export data</b>. File zip-nya dipassword (password dikirim ke email) — extract pakai 7-Zip, upload file CSV yang namanya ada <b>sport</b>-nya.</li>
        <li>Zepp Life: minta export di <b>user.huami.com</b> → Export data → upload <b>SPORT.csv</b>.</li>
        <li>Catatan: export Mi Band cuma ringkasan (jarak, durasi, kalori, detak) — <b>gak ada rute</b>, jadi peta & titik macet gak keisi.</li>
      </ol></details>
      <details class="guide"><summary>🗺️ Google Maps Timeline — rekam motor otomatis tanpa buka app</summary><ol>
        <li>Nyalain di Google Maps → foto profil → <b>Your Timeline</b> (Location History ON). Tiap perjalanan kerekam sendiri.</li>
        <li>Export: HP Android → <b>Settings → Location → Location services → Timeline → Export Timeline data</b>. Upload file .json-nya.</li>
        <li>Titiknya jarang (per beberapa menit), jadi jarak & durasi akurat tapi titik berhenti / per-km gak kebaca. Buat analisis macet tetap pakai Strava.</li>
      </ol></details>
      <details class="guide"><summary>💡 Saran biar datanya enak dianalisis</summary><ul>
        <li>Rekam <b>tiap</b> berangkat & pulang kerja, start pas keluar pintu, stop pas sampai — jangan pakai auto-pause (biar waktu macet ikut kehitung).</li>
        <li>Kalau ada kejadian (hujan, mampir, ban bocor) tulis di catatan aktivitas — muncul di analisis "kenapa lambat".</li>
        <li>Upload seminggu sekali; data yang sama gak bakal dobel.</li>
      </ul></details>
    </div></div>`;

    h += `<div class="panel"><div class="panel-head"><h2>✍️ Tambah manual</h2></div><div class="panel-body"><div class="grid2">
      <div><label class="f">Jenis</label><select class="in" id="m-kind">${KIND_ORDER.map(k => `<option value="${k}">${KINDS[k].ic} ${KINDS[k].label}</option>`).join('')}</select></div>
      <div><label class="f">Tanggal</label><input class="in" type="date" id="m-date" value="${ymd(new Date())}"></div>
      <div><label class="f">Jam mulai</label><input class="in" type="time" id="m-time" value="07:00"></div>
      <div><label class="f">Durasi (menit)</label><input class="in" type="number" id="m-dur" min="1" placeholder="30"></div>
      <div><label class="f">Jarak (km)</label><input class="in" type="number" id="m-km" min="0" step="0.01" placeholder="5"></div>
      <div><label class="f">Perjalanan kerja?</label><select class="in" id="m-comm"><option value="">Bukan</option><option value="berangkat">Berangkat</option><option value="pulang">Pulang</option></select></div>
    </div><label class="f">Judul / catatan</label><input class="in" id="m-title" maxlength="200" placeholder="opsional">
    <div style="margin-top:12px;text-align:right"><button class="btn btn-hl btn-sm" id="m-save">Tambah</button></div></div></div>`;

    const s = S();
    h += `<div class="panel"><div class="panel-head"><h2>⚙️ Setelan</h2></div><div class="panel-body"><div class="grid2">
      <div><label class="f">Jam masuk kerja</label><input class="in" type="time" id="s-ws" value="${String(s.work_start).slice(0,5)}"></div>
      <div><label class="f">Jam pulang kerja</label><input class="in" type="time" id="s-we" value="${String(s.work_end).slice(0,5)}"></div>
      <div><label class="f">Motor irit (km/liter)</label><input class="in" type="number" id="s-kmpl" min="1" step="0.5" value="${s.fuel_kmpl}"></div>
      <div><label class="f">Harga bensin / liter</label><input class="in" type="number" id="s-price" min="0" step="100" value="${s.fuel_price}"></div>
      <div><label class="f">Target lari per bulan (km, 0 = gak ada)</label><input class="in" type="number" id="s-run" min="0" step="1" value="${s.run_target_km}"></div>
    </div><div style="margin-top:12px;text-align:right"><button class="btn btn-hl btn-sm" id="s-save">Simpan setelan</button></div>
    <div class="faint" style="margin-top:10px">Total tersimpan: ${ACTS.length} aktivitas · ${PLACES.length} titik.</div></div></div>`;
    $('tab-body').innerHTML = h;

    const drop = $('drop'), inp = $('file');
    drop.onclick = () => inp.click();
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); runImport(Array.from(e.dataTransfer.files)); };
    inp.onchange = () => { runImport(Array.from(inp.files)); inp.value = ''; };

    $('m-save').onclick = async (ev) => {
      const d = $('m-date').value, t = $('m-time').value, mins = +$('m-dur').value, km = +$('m-km').value || 0;
      if(!d || !t || !(mins > 0)){ toast('Isi tanggal, jam & durasi'); return; }
      const startMs = new Date(d + 'T' + t).getTime();
      const it = mkItem({ source:'manual', kind: $('m-kind').value, title: $('m-title').value.trim(), startMs, elapsed_s: mins * 60, moving_s: mins * 60, distance_m: km * 1000 });
      it.dedupe_key = 'm:' + Math.floor(startMs / 60000);
      delete it._ms;
      ev.target.disabled = true;
      const { data, error } = await supabase.from('jejak_activities').insert({ ...it, user_id: ME.id, commute: $('m-comm').value || null }).select(ACT_COLS).single();
      ev.target.disabled = false;
      if(error){ toast('Gagal: ' + (/duplicate/.test(error.message) ? 'udah ada aktivitas di jam itu' : error.message)); return; }
      ACTS.unshift(data); ACTS.sort((a, b) => msOf(b) - msOf(a)); toast('Ditambahkan');
      $('m-dur').value = ''; $('m-km').value = ''; $('m-title').value = '';
    };
    $('s-save').onclick = async (ev) => {
      const row = { user_id: ME.id, work_start: $('s-ws').value || '08:00', work_end: $('s-we').value || '17:00',
        fuel_kmpl: Math.max(1, +$('s-kmpl').value || 40), fuel_price: Math.max(0, Math.round(+$('s-price').value || 0)),
        run_target_km: Math.max(0, +$('s-run').value || 0), updated_at: new Date().toISOString() };
      ev.target.disabled = true;
      const { data, error } = await supabase.from('jejak_settings').upsert(row).select().single();
      ev.target.disabled = false;
      if(error){ toast('Gagal: ' + error.message); return; }
      SET = data; toast('Setelan tersimpan');
    };
  }

  async function runImport(files){
    if(!files.length) return;
    const sinceMs = new Date(($('since').value || '2000-01-01') + 'T00:00:00').getTime();
    const st = $('imp-status');
    st.textContent = 'Membaca file…'; $('imp-preview').innerHTML = '';
    let res;
    try{ res = await processFiles(files, sinceMs, (t) => { st.textContent = 'Memproses ' + t + '…'; }); }
    catch(e){ st.textContent = 'Gagal: ' + e.message; return; }
    // match against what's already stored
    const existing = ACTS.map(a => ({ a, ms: msOf(a) }));
    PENDING = res.items.map(it => {
      const m = existing.find(x => Math.abs(x.ms - it._ms) < DUP_WINDOW_MS);
      let status = 'baru', on = it.kind !== 'lainnya' || it.source !== 'google';
      if(m){
        // stored summary-only rows (Mi Band CSV) have no coordinates; a GPS file can fill them in
        if(it.route && m.a.start_lat == null){ status = 'lengkapi'; }
        else { status = 'ada'; on = false; }
      }
      return { it, status, on, matchId: m ? m.a.id : null };
    }).sort((a, b) => b.it._ms - a.it._ms);
    st.innerHTML = `Ketemu <b>${PENDING.length}</b> aktivitas sejak ${esc($('since').value)}` +
      (res.errors.length ? ` · <span style="color:var(--danger)">${res.errors.length} file gagal</span> <details style="display:inline"><summary class="faint" style="display:inline;cursor:pointer">lihat</summary><div class="faint">${res.errors.slice(0, 30).map(esc).join('<br>')}</div></details>` : '');
    if(!PENDING.length){ $('imp-preview').innerHTML = `<div class="muted" style="margin-top:8px">Gak ada aktivitas di rentang tanggal itu. Coba mundurin tanggal "sejak".</div>`; return; }
    renderPreview();
  }
  function renderPreview(){
    const n = PENDING.filter(p => p.on).length;
    let h = `<div class="tscroll" style="margin-top:10px;max-height:420px;overflow:auto"><table class="t"><tr><th><input type="checkbox" id="pv-all" ${n === PENDING.length ? 'checked' : ''}></th><th>Waktu</th><th>Jenis</th><th class="n">Km</th><th class="n">Durasi</th><th class="n">Speed</th><th>Sumber</th><th>Status</th></tr>`;
    PENDING.forEach((p, i) => {
      const it = p.it;
      h += `<tr><td><input type="checkbox" data-pv="${i}" ${p.on ? 'checked' : ''}></td><td class="mono" style="white-space:nowrap">${niceDay(it._ms)} ${hhmm(minOfDay(it._ms))}</td>
        <td><select class="in sm" data-pk="${i}">${KIND_ORDER.map(k => `<option value="${k}" ${it.kind === k ? 'selected' : ''}>${KINDS[k].ic} ${KINDS[k].label}</option>`).join('')}</select></td>
        <td class="n">${kmStr(it.distance_m)}</td><td class="n">${durM(it.elapsed_s)}</td><td class="n">${speedLabel(it)}</td>
        <td class="faint">${esc(it.source)}${it.source_type ? ' · ' + esc(it.source_type) : ''}${it.route ? ' · 🗺️' : ''}</td>
        <td>${p.status === 'baru' ? '<span class="pill good">baru</span>' : p.status === 'lengkapi' ? '<span class="pill mid">lengkapi rute</span>' : '<span class="pill none">sudah ada</span>'}</td></tr>`;
    });
    h += `</table></div><div class="row" style="margin-top:12px;justify-content:space-between"><span class="faint">Cek jenisnya — motor/lari ditebak dari speed.</span><button class="btn btn-hl" id="pv-save" ${n ? '' : 'disabled'}>Simpan ${n} aktivitas</button></div>`;
    $('imp-preview').innerHTML = h;
    document.querySelectorAll('[data-pv]').forEach(cb => cb.onchange = () => { PENDING[+cb.dataset.pv].on = cb.checked; renderPreview(); });
    document.querySelectorAll('[data-pk]').forEach(s => s.onchange = () => { PENDING[+s.dataset.pk].it.kind = s.value; });
    $('pv-all').onchange = (e) => { PENDING.forEach(p => { p.on = e.target.checked; }); renderPreview(); };
    $('pv-save').onclick = saveImport;
  }
  async function saveImport(){
    const btn = $('pv-save'); btn.disabled = true;
    const chosen = PENDING.filter(p => p.on);
    const strip = (it) => { const o = { ...it, user_id: ME.id }; delete o._ms; return o; };
    let ok = 0, fail = [];
    const fresh = chosen.filter(p => p.status !== 'lengkapi').map(p => strip(p.it));
    for(let i = 0; i < fresh.length; i += 25){
      btn.textContent = `Menyimpan ${Math.min(i + 25, fresh.length)}/${fresh.length}…`;
      const { error } = await supabase.from('jejak_activities').upsert(fresh.slice(i, i + 25), { onConflict: 'user_id,dedupe_key' });
      if(error) fail.push(error.message); else ok += Math.min(25, fresh.length - i);
    }
    for(const p of chosen.filter(p => p.status === 'lengkapi')){
      const o = strip(p.it); delete o.dedupe_key; delete o.user_id; o.updated_at = new Date().toISOString();
      const { error } = await supabase.from('jejak_activities').update(o).eq('id', p.matchId);
      if(error) fail.push(error.message); else { ok++; delete ROUTES[p.matchId]; }
    }
    await loadActs();
    PENDING = [];
    $('imp-preview').innerHTML = '';
    $('imp-status').innerHTML = `✅ ${ok} aktivitas tersimpan.` + (fail.length ? ` <span style="color:var(--danger)">Gagal: ${esc(fail[0])}</span>` : '') + ` <a href="#" data-goto="ringkasan">Lihat ringkasan →</a>`;
    wireGoto();
    const latest = ACTS[0];
    if(latest){ const d = new Date(msOf(latest)); MONTH = { y: d.getFullYear(), m: d.getMonth() }; }
  }

  // ================================================================ BOOT
  async function boot(){
    $('app-root').innerHTML = `<div class="empty-hint" style="padding-top:60px;">Narik jejak lo…</div>`;
    try{
      const [{ data: set, error }] = await Promise.all([
        supabase.from('jejak_settings').select('*').eq('user_id', ME.id).maybeSingle(),
        loadActs(), loadPlaces(),
      ]);
      if(error) throw error;
      SET = set || null;
    }catch(e){
      $('app-root').innerHTML = `<div class="empty-hint" style="padding-top:60px;">Gagal narik data: ${esc(e.message || e)}<br><br><a href="#" onclick="location.reload();return false;">Coba lagi</a></div>`;
      return;
    }
    const now = new Date();
    MONTH = { y: now.getFullYear(), m: now.getMonth() };
    const h = (location.hash || '').slice(1);
    switchTab(TABS.some(t => t[0] === h) ? h : (ACTS.length ? 'ringkasan' : 'data'));
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const authCtx = await requireAuth('index.html');
    if(!authCtx) return;
    ME = authCtx.user;
    await boot();
  });
})();
</script>
</body>
</html>
