<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil Diary — Gembel AI PIK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/soft.css">
<link rel="stylesheet" href="devil.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../assets/supabaseClient.js"></script>
</head>
<body class="soft-dark">

<div class="soft-top">
  <div class="soft-brand">
    <div class="mark" id="brand-mark">🕯️</div>
    <div>
      <div class="t1">Devil Diary</div>
      <div class="t2">Gembel AI PIK</div>
    </div>
  </div>
  <a class="soft-back" href="../../dashboard.html">← Dashboard</a>
</div>

<div class="soft-wrap narrow">

  <div class="diary-hero fade-in">
    <div class="mood-orb" id="mood-orb"><span id="mood-icon">🌒</span></div>
    <h1 id="title">Checking soul…</h1>
    <p class="subtitle" id="subtitle">Verifying security context…</p>
  </div>

  <!-- ANGEL GATE -->
  <div id="angel-section" class="card mood-card angel hidden fade-in">
    <div class="mood-head">
      <span class="pill sky">😇 Angel Note Required</span>
      <span class="angel-progress mono" id="angel-progress"></span>
    </div>
    <p class="mood-sub">You must log <b id="angel-left" class="angel-count">10</b> more positive notes to unlock the abyss.</p>
    <div class="progress-track"><div class="progress-fill sky" id="angel-bar" style="width:0%"></div></div>
    <textarea id="angel-input" placeholder="Write a good deed, a prayer, or a blessing to the universe…"></textarea>
    <button id="btn-submit-angel" class="btn btn-sky btn-block">Submit Angel Note ☁️</button>
  </div>

  <!-- DEVIL VENT -->
  <div id="devil-section" class="card mood-card devil hidden fade-in">
    <div class="mood-head">
      <span class="pill rose">👿 Devil Note</span>
    </div>
    <p class="mood-sub">Spill your dark thoughts, anger, or confessions about how cold the world is. Nobody reads this but you.</p>
    <textarea id="devil-input" placeholder="Release it here…"></textarea>
    <button id="btn-submit-devil" class="btn btn-rose btn-block">Release to Darkness 🔥</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="devil.js"></script>
</body>
</html>
