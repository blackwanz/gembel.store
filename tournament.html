    if(!bar || !text) return;
    var c = S.ui.registrationChecks;
    var done = (c.dob?1:0)+(c.email?1:0)+(c.gopay?1:0)+(c.rekening?1:0)+(c.partnerEmail?1:0);
    if(done===5){
      bar.classList.add('status-bar-ready');
      text.textContent = 'Semua verifikasi selesai — tim siap didaftarkan!';
    } else {
      bar.classList.remove('status-bar-ready');
      text.textContent = done + '/5 verifikasi selesai. Lengkapi verifikasi lalu daftarkan tim.';
    }
  }
  function runVerification(key){
    var badge = document.getElementById('badge_'+key);
    if(!badge) return;
    badge.classList.remove('verified');
    badge.classList.add('verifying');
    badge.innerHTML = ICONS.spinner;
    setTimeout(function(){
      badge.classList.remove('verifying');
      badge.classList.add('verified');
      badge.innerHTML = ICONS.check;
      S.ui.registrationChecks[key] = true;
      updateRegStatusBar();
    }, 1000 + Math.random()*700);
  }
  async function submitRegistration(){
    if(!S.registrationOpen){ toast('Pendaftaran sedang ditutup oleh panitia.', 'error'); return; }
    var cat = S.categories.filter(function(c){ return c.id === (val('regCategorySelect') || getCat().id); })[0] || getCat();
    if(!cat){ toast('Belum ada kategori untuk didaftari.', 'error'); return; }
    // Dedupe client-side: one registration per user per category (RLS doesn't enforce this for
    // v1, per the task's own call -- this is a UX guard, not a security boundary).
    var already = cat.teams.some(function(t){ return t.registeredBy && t.registeredBy===S.currentUserId; });
    if(already){ toast('Anda sudah mendaftarkan tim di kategori ini.', 'error'); return; }
    var teamName = val('teamNameInput').trim();
    var p1n = val('p1NameInput').trim(), p1e = val('p1EmailInput').trim();
    var p2n = val('p2NameInput').trim(), p2e = val('p2EmailInput').trim();
    if(!teamName || !p1n || !p1e || !p2n || !p2e){
      toast('Lengkapi nama tim serta nama & email kedua pemain.', 'error');
      return;
    }
    var checks = S.ui.registrationChecks;
    var payload = {
      status:'active',
      players: [ {name:p1n, email:p1e}, {name:p2n, email:p2e, partnerVerified: checks.partnerEmail} ],
      checks: { dob:checks.dob, email:checks.email, gopay:checks.gopay, rekening:checks.rekening },
      dob: val('dobInput'), gopayNumber: val('gopayInput'), bankName:'', bankAccount: val('rekeningInput')
    };
    try{
      var row = await registerTeamCloud(cat.id, teamName, payload);
      var team = teamRowToTeam(row);
      cat.teams.push(team);
      S.ui.myTeamIds.push(team.id);
      S.ui.registrationChecks = { dob:false, email:false, gopay:false, rekening:false, partnerEmail:false };
      var complete = checks.dob && checks.email && checks.gopay && checks.rekening && checks.partnerEmail;
      toast(complete ? 'Tim "'+teamName+'" berhasil didaftarkan!' : 'Tim "'+teamName+'" didaftarkan dengan verifikasi belum lengkap.');
    }catch(e){
      toast('Gagal mendaftar: '+e.message, 'error');
    }
    render();
  }

  /* ---------------- EVENT DELEGATION ---------------- */
  // Actions gated to admins-only client-side, in addition to (not instead of) the RLS policies in
  // db/migrations/0028_tournaments.sql that actually enforce it server-side -- this just keeps a
  // non-admin from seeing a request bounce off the database with an opaque error.
  var ADMIN_ONLY_ACTIONS = {
    'show-add-category':1, 'create-category':1, 'gen-dummy-teams':1, 'save-category-name':1,
    'save-group-settings':1, 'assign-groups':1, 'generate-bracket':1, 'advance-knockout':1,
    'delete-team':1, 'declare-winner':1, 'save-group-match':1, 'archive-pdf':1, 'reset-category':1,
    'delete-category':1, 'toggle-rules-edit':1, 'save-rules':1, 'toggle-registration':1,
    'create-tournament':1, 'delete-dummy-teams':1, 'edit-slot':1, 'save-slot-editor':1,
    'close-slot-editor':1, 'edit-team':1, 'save-team-editor':1, 'close-team-editor':1
  };
  app.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.dataset.action;
    if(ADMIN_ONLY_ACTIONS[action] && !S.isAdmin) return;
    var cat = getCat();
    switch(action){
      case 'toggle-registration':
        setRegistrationOpen(!S.registrationOpen);
        return;
      case 'create-tournament': {
        var tname = val('newTournamentName').trim() || 'Turnamen Baru';
        createTournamentAdmin(tname).then(function(ok){
          if(ok){ subscribeRealtime(); toast('Turnamen "'+tname+'" dibuat'); }
          render();
        });
        return;
      }
      case 'select-category':
        S.activeCategoryId = btn.dataset.id;
        S.ui.adminTab = 'ringkasan';
        render();
        break;
      case 'show-add-category':
        S.ui.showAddCategory = true;
        render();
        var el1 = document.getElementById('newCategoryName'); if(el1) el1.focus();
        break;
      case 'cancel-add-category':
        S.ui.showAddCategory = false;
        render();
        break;
      case 'create-category': {
        var nm = val('newCategoryName').trim() || 'Kategori Baru';
        var fmt = val('newCategoryFormat');
        addCategory(nm, fmt);
        S.ui.showAddCategory = false;
        S.ui.adminTab = 'pengaturan';
        toast('Kategori "'+nm+'" dibuat');
        queueCloudSync();
        break;
      }
      case 'admin-tab':
        S.ui.adminTab = btn.dataset.tab;
        S.ui.teamsPage = 1;
        render();
        break;
      case 'player-tab':
        S.ui.playerTab = btn.dataset.tab;
        render();
        break;
      case 'toggle-rules':
        S.rulesOpen = !S.rulesOpen;
        render();
        break;
      case 'toggle-rules-edit':
        S.ui.rulesEditing = !S.ui.rulesEditing;
        render();
        break;
      case 'save-rules':
        S.rulesText = val('rulesTextarea');
        S.ui.rulesEditing = false;
        toast('Peraturan disimpan');
        queueCloudSync();
        break;
      case 'dismiss-banner':
        S.ui.bannerDismissed = true;
        render();
        break;
      case 'gen-dummy-teams': {
        // Real validation (the input's min/max HTML attributes alone don't stop parseInt('-5',10)
        // or parseInt('',10) from sneaking through as a request for a negative/NaN count) --
        // and a hard block once a bracket already exists for this category, since teams added
        // after generation never get seeded a slot until the bracket is regenerated, which is
        // exactly the confusing "why isn't my team in the bracket" state this guards against.
        if(cat.bracket){ toast('Bagan sudah dibuat -- reset bagan dulu sebelum menambah tim contoh baru.', 'error'); return; }
        var rawCount = val('dummyCount').trim();
        var n = parseInt(rawCount, 10);
        if(!rawCount || isNaN(n) || n < 1 || n > 4000){
          toast('Jumlah tim harus angka antara 1 dan 4000.', 'error');
          return;
        }
        S.ui.lastDummyCount = n;
        bulkCreateDummyTeams(cat, n);
        return;
      }
      case 'delete-dummy-teams': {
        var dummyIds = cat.teams.filter(function(t){ return t.isDummy; }).map(function(t){ return t.id; });
        if(!dummyIds.length) return;
        openConfirm(dummyIds.length+' tim contoh akan dihapus permanen'+(cat.bracket||cat.groups?' (bagan/grup kategori ini juga akan direset karena mereferensikan tim-tim ini)':'')+'. Lanjutkan?', function(){
          cat.teams = cat.teams.filter(function(t){ return !t.isDummy; });
          if(cat.bracket){ cat.bracket = null; }
          if(cat.groups){ cat.groups = null; cat.groupsLocked = false; }
          dummyIds.forEach(function(id){ deleteTeamRowAdmin(id); });
          toast(dummyIds.length+' tim contoh dihapus.');
          queueCloudSync();
          render();
        });
        return;
      }
      case 'save-category-name': {
        var newName = val('categoryNameInput').trim();
        if(newName) cat.name = newName;
        toast('Nama kategori disimpan');
        queueCloudSync();
        break;
      }
      case 'save-group-settings': {
        cat.groupSize = Math.max(2, parseInt(val('groupSizeInput'),10) || 4);
        cat.advancePerGroup = Math.max(1, parseInt(val('advancePerGroupInput'),10) || 2);
        toast('Pengaturan grup disimpan');
        queueCloudSync();
        break;
      }
      case 'assign-groups': {
        var doAssign = function(){ assignGroups(cat); toast('Grup berhasil dibuat'); S.ui.adminTab='grup'; queueCloudSync(); render(); };
        if(cat.groups) openConfirm('Buat ulang pengelompokan grup? Hasil pertandingan grup saat ini akan hilang.', doAssign);
        else doAssign();
        return;
      }
      case 'generate-bracket': {
        var activeTeams = cat.teams.filter(function(t){ return t.status==='active'; });
        if(activeTeams.length<2){ toast('Minimal 2 tim aktif diperlukan untuk membuat bagan.', 'error'); return; }
        var doGen = function(){
          cat.bracket = generateKnockoutBracket(shuffle(activeTeams));
          delete S.ui.bracketZoom[cat.id];
          toast('Bagan berhasil dibuat');
          S.ui.adminTab='bagan';
          queueCloudSync();
          render();
        };
        if(cat.bracket) openConfirm('Bagan sudah ada. Buat ulang? Semua hasil pertandingan akan hilang.', doGen);
        else doGen();
        return;
      }
      case 'advance-knockout': {
        openConfirm('Lanjutkan ke babak gugur? Fase grup akan dikunci dan tidak bisa diubah lagi.', function(){
          advanceGroupsToKnockout(cat);
          delete S.ui.bracketZoom[cat.id];
          toast('Babak gugur berhasil dibuat dari hasil grup');
          S.ui.adminTab = 'bagan';
          queueCloudSync();
          render();
        });
        return;
      }
      case 'bracket-mode':
        S.ui.bracketMode[cat.id] = btn.dataset.mode;
        render();
        return;
      case 'zoom-in': {
        var zIn = clampZoom((S.ui.bracketZoom[cat.id]||100) + 10);
        S.ui.bracketZoom[cat.id] = zIn;
        applyZoomStyle(cat, zIn);
        updateZoomUI(zIn);
        return;
      }
      case 'zoom-out': {
        var zOut = clampZoom((S.ui.bracketZoom[cat.id]||100) - 10);
        S.ui.bracketZoom[cat.id] = zOut;
        applyZoomStyle(cat, zOut);
        updateZoomUI(zOut);
        return;
      }
      case 'zoom-fit': {
        var zFit = computeFitZoom(cat);
        S.ui.bracketZoom[cat.id] = zFit;
        applyZoomStyle(cat, zFit);
        updateZoomUI(zFit);
        return;
      }
      case 'zoom-map': {
        var zMap = computeWholeMapZoom(cat);
        S.ui.bracketZoom[cat.id] = zMap;
        applyZoomStyle(cat, zMap);
        updateZoomUI(zMap);
        toast('Bagan disusutkan jadi satu bentuk utuh');
        return;
      }
      case 'zoom-100': {
        S.ui.bracketZoom[cat.id] = 100;
        applyZoomStyle(cat, 100);
        updateZoomUI(100);
        return;
      }
      case 'delete-team': {
        var tid = btn.dataset.team;
        openConfirm('Hapus tim ini secara permanen dari kategori?', function(){
          cat.teams = cat.teams.filter(function(t){ return t.id!==tid; });
          deleteTeamRowAdmin(tid);
          render();
        });
        return;
      }
      case 'edit-team':
        S.ui.teamEditor = { teamId: btn.dataset.team };
        render();
        return;
      case 'close-team-editor':
        S.ui.teamEditor = null;
        render();
        return;
      case 'save-team-editor':
        submitTeamEditor();
        return;
      case 'edit-slot':
        if(!cat.bracket) return;
        S.ui.slotEditor = { r: parseInt(btn.dataset.round,10), i: parseInt(btn.dataset.idx,10), side: btn.dataset.side };
        render();
        return;
      case 'close-slot-editor':
        S.ui.slotEditor = null;
        render();
        return;
      case 'save-slot-editor':
        submitSlotEditor();
        return;
      case 'clear-slot': {
        var ce = S.ui.slotEditor;
        if(ce) assignSlotTeam(cat, ce.r, ce.i, ce.side, null);
        S.ui.slotEditor = null;
        toast('Slot dikosongkan.');
        render();
        return;
      }
      case 'teams-page':
        S.ui.teamsPage = parseInt(btn.dataset.page,10);
        render();
        break;
      case 'groups-page':
        S.ui.groupsPage = parseInt(btn.dataset.page,10);
        render();
        break;
      case 'round-select':
        S.ui.bracketRound[cat.id] = parseInt(btn.dataset.round,10);
        S.ui.bracketPage[cat.id] = 1;
        render();
        break;
      case 'bracket-page':
        S.ui.bracketPage[cat.id] = parseInt(btn.dataset.page,10);
        render();
        break;
      case 'bracket-jump': {
        var q = (val('bracketSearchInput')||'').trim().toLowerCase();
        if(!q){ return; }
        S.ui.bracketSearch[cat.id] = q;
        var bracket = cat.bracket;
        var found = null;
        for(var r=bracket.rounds.length-1; r>=0 && !found; r--){
          for(var idx=0; idx<bracket.rounds[r].length; idx++){
            var mm = bracket.rounds[r][idx];
            var ta = teamById(cat, mm.teamAId), tb = teamById(cat, mm.teamBId);
            if((ta && ta.name.toLowerCase().indexOf(q)>=0) || (tb && tb.name.toLowerCase().indexOf(q)>=0)){ found = {r:r, i:idx}; break; }
          }
        }
        if(found){
          var jumpMode = S.ui.bracketMode[cat.id] || 'peta';
          if(jumpMode==='paged'){
            S.ui.bracketRound[cat.id] = found.r;
            S.ui.bracketPage[cat.id] = Math.floor(found.i/12)+1;
          } else {
            S.ui.bracketZoom[cat.id] = 100;
            S.ui.bracketScrollTo = found.r+'-'+found.i;
          }
          toast('Tim ditemukan di Babak '+(found.r+1));
        } else {
          toast('Tim tidak ditemukan di bagan ini', 'error');
        }
        render();
        return;
      }
      case 'open-match-editor':
        S.ui.openMatch = (S.ui.openMatch===btn.dataset.match) ? null : btn.dataset.match;
        render();
        break;
      case 'close-match-editor':
        S.ui.openMatch = null;
        render();
        break;
      case 'declare-winner': {
        var r2 = parseInt(btn.dataset.round,10), i2 = parseInt(btn.dataset.idx,10), side = btn.dataset.winner;
        var bracket2 = cat.bracket;
        var m2 = bracket2.rounds[r2][i2];
        var winnerId = side==='A' ? m2.teamAId : m2.teamBId;
        var sA = document.getElementById('scoreA_'+r2+'-'+i2);
        var sB = document.getElementById('scoreB_'+r2+'-'+i2);
        m2.scoreA = sA && sA.value!=='' ? parseInt(sA.value,10) : null;
        m2.scoreB = sB && sB.value!=='' ? parseInt(sB.value,10) : null;
        var woEl = document.getElementById('woCheck_'+r2+'-'+i2);
        setMatchWinner(bracket2, r2, i2, winnerId, woEl ? woEl.checked : false);
        S.ui.openMatch = null;
        toast('Hasil pertandingan disimpan');
        queueCloudSync();
        break;
      }
      case 'save-group-match': {
        var g = cat.groups.filter(function(x){ return x.id===btn.dataset.group; })[0];
        var m3 = g.matches.filter(function(x){ return x.id===btn.dataset.match; })[0];
        var aVal = val('gs_a_'+m3.id), bVal = val('gs_b_'+m3.id);
        if(aVal===''||bVal===''){ toast('Isi kedua skor terlebih dahulu', 'error'); return; }
        var sa = parseInt(aVal,10), sb = parseInt(bVal,10);
        if(sa===sb){ toast('Skor tidak boleh seri', 'error'); return; }
        m3.scoreA = sa; m3.scoreB = sb; m3.winnerId = sa>sb ? m3.teamAId : m3.teamBId; m3.walkover = false;
        toast('Skor disimpan');
        queueCloudSync();
        break;
      }
      case 'archive-pdf': {
        archiveCategoryToPdf(cat);
        return;
      }
      case 'reset-category': {
        openConfirm('Hapus semua tim, grup, dan bagan pada kategori ini?', function(){
          var idsToDelete = cat.teams.map(function(t){ return t.id; });
          cat.teams = []; cat.groups = null; cat.groupsLocked = false; cat.bracket = null;
          idsToDelete.forEach(function(id){ deleteTeamRowAdmin(id); });
          toast('Kategori direset');
          queueCloudSync();
          render();
        });
        return;
      }
      case 'delete-category': {
        openConfirm('Hapus kategori "'+cat.name+'" beserta seluruh data timnya?', function(){
          var idsToDelete = cat.teams.map(function(t){ return t.id; });
          S.categories = S.categories.filter(function(c){ return c.id!==cat.id; });
          S.activeCategoryId = S.categories.length ? S.categories[0].id : null;
          S.ui.adminTab = 'ringkasan';
          idsToDelete.forEach(function(id){ deleteTeamRowAdmin(id); });
          toast('Kategori dihapus');
          queueCloudSync();
          render();
        });
        return;
      }
      case 'confirm-yes': {
        var cb = S.ui.confirmCb;
        S.ui.confirmOpen = false;
        S.ui.confirmCb = null;
        if(cb) cb();
        else render();
        return;
      }
      case 'confirm-no':
        S.ui.confirmOpen = false;
        S.ui.confirmCb = null;
        render();
        break;
      case 'quick-self-fill':
        fillSelfDummy();
        return;
      case 'verify-partner-email': {
        var p2email = val('p2EmailInput').trim();
        if(!p2email){ toast('Minta partner mengisi emailnya terlebih dahulu', 'error'); return; }
        runVerification('partnerEmail');
        return;
      }
      case 'verify-check': {
        var key = btn.dataset.check;
        runVerification(key);
        return;
      }
      case 'submit-registration':
        submitRegistration();
        return;
      case 'withdraw-self-team': {
        var wtid = btn.dataset.team;
        openConfirm('Batalkan pendaftaran tim ini?', async function(){
          try{
            await withdrawTeamCloud(wtid);
            var wcat = getCat();
            if(wcat) wcat.teams = wcat.teams.filter(function(t){ return t.id!==wtid; });
            S.ui.myTeamIds = S.ui.myTeamIds.filter(function(id){ return id!==wtid; });
            toast('Pendaftaran dibatalkan');
          }catch(e){
            toast('Gagal membatalkan: '+e.message, 'error');
          }
          render();
        });
        return;
      }
      default:
        return;
    }
    render();
  });

  app.addEventListener('change', function(e){
    var el = e.target;
    var actionName = el.dataset ? el.dataset.actionName : null;
    if(el.id==='teamsPerPageSelect'){
      S.ui.teamsPerPage = parseInt(el.value,10);
      S.ui.teamsPage = 1;
      render();
    } else if(actionName==='team-status-select'){
      if(!S.isAdmin) return;
      setTeamStatus(S.activeCategoryId, el.dataset.team, el.value);
    } else if(actionName==='format-radio'){
      if(!S.isAdmin) return;
      var cat = getCat();
      cat.format = el.value;
      queueCloudSync();
      render();
    } else if(el.id==='regCategorySelect'){
      // no state change needed; read at submit time
    }
  });

  app.addEventListener('input', function(e){
    var el = e.target;
    if(el.id==='teamsSearchInput'){
      S.ui.teamsSearch = el.value;
      S.ui.teamsPage = 1;
      render();
    } else if(el.id==='bracketSearchInput'){
      var cat = getCat();
      S.ui.bracketSearch[cat.id] = el.value;
      render();
    } else if(el.id==='zoomSlider'){
      // Direct DOM update (no render()) so dragging the slider stays smooth
      // and never rebuilds the whole (potentially huge) bracket tree mid-drag.
      var zcat = getCat();
      var z = clampZoom(parseInt(el.value,10) || 100);
      S.ui.bracketZoom[zcat.id] = z;
      applyZoomStyle(zcat, z);
      var label = document.getElementById('zoomLabel');
      if(label) label.textContent = z+'%';
    }
  });

  /* ---------------- INIT ---------------- */
  async function boot(){
    var ctx = await requireAuth('index.html');
    if(!ctx) return; // requireAuth already redirected to login
    S.currentUserId = ctx.user.id;
    S.isAdmin = !!(ctx.profile && ctx.profile.role === 'admin');
    S.role = S.isAdmin ? 'admin' : 'player';

    var found = await loadTournament();
    if(found) subscribeRealtime();
    render();
  }
  boot();
})();
</script>
</body>
</html>
