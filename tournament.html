<!DOCTYPE html>
<!--
============================================================
 RALLY BRACKET — Manajemen Turnamen Bulutangkis (CLOUD VERSION)
============================================================
 Ported from a self-contained prototype (in-memory-only, fake
 client-side role-switch toggle, no persistence) onto this
 site's own Supabase backend -- same boilerplate every other
 app here uses (assets/supabaseClient.js + assets/auth.js
 behind requireAuth()).

 Unlike every other app on this site (archery.html, habbit.html,
 progbar.html, ...) this data is NOT per-user: one admin runs a
 tournament, many players register into it, everyone watches the
 same bracket. So instead of one row per user it's:
   - public.tournaments        one row per tournament, `data` jsonb
                                holds categories' format/settings/
                                groups/bracket (NOT the teams --
                                those are normalized out below so a
                                non-admin can be granted just enough
                                write access to register/withdraw
                                their own team, nothing else).
   - public.tournament_teams   one row per registered team.
 See db/migrations/0028_tournaments.sql for the schema, RLS, and
 the register_tournament_team() RPC that self-registration goes
 through instead of a raw insert.

 Admin detection is real: S.isAdmin comes from requireAuth()'s
 profile.role === 'admin', not a client-side toggle. The
 prototype's role-switch buttons are gone; the topbar shows a
 read-only badge for the role that was actually detected.

 The prototype's own bracket-generation/scoring/rendering engine
 (generateKnockoutBracket, setMatchWinner, assignGroups,
 computeStandings, etc.) is left untouched -- only WHERE state is
 read from / written to changed.
============================================================
-->
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rally Bracket — Gembel AI PIK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/auth.js"></script>
<style>
  :root{
    --bg:#f3f5fb;
    --bg-elev:#ffffff;
    --surface: rgba(20,30,70,0.045);
    --surface-strong: rgba(20,30,70,0.085);
    --border: rgba(20,30,70,0.14);
    --line: rgba(20,30,70,0.22);
    --text:#161b30;
    --text-dim:#5c6482;
    --text-faint:#8891ab;
    --accent:#a66a00;
    --accent-bg: rgba(255,181,69,0.22);
    --accent-ink:#3a2500;
    --accent-solid:#c9821a;
    --accent2:#3d52c7;
    --accent2-bg: rgba(61,82,199,0.12);
    --success:#1f8a5f;
    --success-bg: rgba(31,138,95,0.14);
    --warning:#a8690a;
    --warning-bg: rgba(168,105,10,0.14);
    --danger:#c8384f;
    --danger-bg: rgba(200,56,79,0.13);
    --shadow: 0 12px 32px rgba(20,30,70,0.10);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body:'Manrope', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c1226;
      --bg-elev:#141b38;
      --surface: rgba(255,255,255,0.055);
      --surface-strong: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.10);
      --line: rgba(255,255,255,0.16);
      --text:#eef1fb;
      --text-dim:#a6adc9;
      --text-faint:#727aa0;
      --accent:#ffb545;
      --accent-bg: rgba(255,181,69,0.16);
      --accent-ink:#2a1a00;
      --accent-solid:#ffb545;
      --accent2:#8ba0ff;
      --accent2-bg: rgba(139,160,255,0.14);
      --success:#4fd39a;
      --success-bg: rgba(79,211,154,0.14);
      --warning:#ffbf5f;
      --warning-bg: rgba(255,191,95,0.14);
      --danger:#ff7d92;
      --danger-bg: rgba(255,125,146,0.14);
      --shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1226;
    --bg-elev:#141b38;
    --surface: rgba(255,255,255,0.055);
    --surface-strong: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.10);
    --line: rgba(255,255,255,0.16);
    --text:#eef1fb;
    --text-dim:#a6adc9;
    --text-faint:#727aa0;
    --accent:#ffb545;
    --accent-bg: rgba(255,181,69,0.16);
    --accent-ink:#2a1a00;
    --accent-solid:#ffb545;
    --accent2:#8ba0ff;
    --accent2-bg: rgba(139,160,255,0.14);
    --success:#4fd39a;
    --success-bg: rgba(79,211,154,0.14);
    --warning:#ffbf5f;
    --warning-bg: rgba(255,191,95,0.14);
    --danger:#ff7d92;
    --danger-bg: rgba(255,125,146,0.14);
    --shadow: 0 16px 40px rgba(0,0,0,0.45);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:800; margin:0; text-wrap:balance; letter-spacing:0.01em; }
  button,input,select,textarea{ font-family:inherit; color:inherit; }
  input,select,textarea{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 11px; font-size:14px; color:var(--text); width:100%;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--accent2); outline-offset:1px;
  }
  textarea{ resize:vertical; font-family:var(--font-body); }
  table{ border-collapse:collapse; width:100%; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  .shell{ max-width:1240px; margin:0 auto; padding-block:16px 64px; }

  /* Topbar */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:65;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 16px; margin-bottom:14px;
    background:var(--surface); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand-mark{ width:34px; height:34px; flex:none; }
  .brand-mark svg{ width:100%; height:100%; display:block; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.05; }
  .brand-title{ font-family:var(--font-display); font-size:22px; font-weight:900; letter-spacing:0.01em; }
  .brand-sub{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-faint); font-weight:700; }

  .role-switch{ display:flex; background:var(--surface-strong); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
  .role-btn{ border:none; background:transparent; padding:7px 16px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; color:var(--text-dim); }
  .role-btn.active{ background:var(--accent); color:var(--accent-ink); }

  .icon-btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface-strong); color:var(--text); padding:8px 13px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; }
  .icon-btn svg{ width:16px; height:16px; flex:none; }
  .icon-btn:hover{ border-color:var(--line); }

  /* Category tabs */
  .cat-tabs-row{ display:flex; align-items:center; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:10px; }
  .cat-tab{
    flex:none; border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    padding:9px 16px; border-radius:var(--radius-md); font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:8px;
  }
  .cat-tab.active{ background:var(--bg-elev); color:var(--text); border-color:var(--accent2); box-shadow:0 0 0 1px var(--accent2) inset; }
  .cat-tab .fmt-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent2); flex:none; }
  .cat-tab .fmt-dot.groups{ background:var(--accent); }
  .cat-tab-add{ flex:none; border:1px dashed var(--line); background:transparent; color:var(--text-faint); padding:9px 14px; border-radius:var(--radius-md); font-weight:700; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .add-cat-form{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px; margin-bottom:12px; }
  .add-cat-form input{ width:220px; }
  .add-cat-form select{ width:180px; }

  /* Panels */
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding:20px; box-shadow:var(--shadow);
  }
  .panel + .panel{ margin-top:14px; }
  .panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-title{ font-size:19px; }
  .panel-desc{ color:var(--text-dim); font-size:13px; margin-top:3px; }

  .banner{
    display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    background:var(--accent2-bg); border:1px solid var(--accent2); color:var(--text);
    padding:12px 16px; border-radius:var(--radius-md); margin-bottom:14px; font-size:13.5px;
  }

  /* Subnav */
  .subnav{ display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:0; }
  .subnav-btn{ flex:none; border:none; background:transparent; color:var(--text-dim); padding:10px 14px; font-weight:700; font-size:13.5px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .subnav-btn.active{ color:var(--text); border-bottom-color:var(--accent); }

  /* Buttons */
  .btn{ display:inline-flex; align-items:center; gap:7px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-strong); color:var(--text); padding:10px 16px; font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  .btn svg, .cat-tab-add svg, .toast svg{ flex:none; }
  .btn:hover{ border-color:var(--line); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn-secondary{ background:var(--accent2); color:#fff; border-color:transparent; }
  .btn-ghost{ background:transparent; }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); border-color:transparent; }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }
  .btn-block{ width:100%; justify-content:center; }

  /* Stat grid */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; }
  .stat-value{ font-family:var(--font-display); font-size:32px; font-weight:800; line-height:1; }
  .stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-weight:700; margin-top:6px; }

  .cat-summary-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .cat-summary-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .cat-summary-title{ font-family:var(--font-display); font-size:19px; font-weight:800; }
  .cat-summary-meta{ font-size:12px; color:var(--text-dim); display:flex; gap:10px; flex-wrap:wrap; }

  /* Fields */
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:700; color:var(--text-dim); }
  .field-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .field-inline{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .hint{ font-size:12px; color:var(--text-faint); }
  .radio-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .radio-card{ flex:1; min-width:180px; border:1px solid var(--border); background:var(--surface-strong); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
  .radio-card.checked{ border-color:var(--accent2); box-shadow:0 0 0 1px var(--accent2) inset; }
  .radio-card input{ width:auto; margin-top:2px; }
  .radio-card-title{ font-weight:800; font-size:13.5px; }
  .radio-card-desc{ font-size:12px; color:var(--text-dim); margin-top:2px; }

  /* Search */
  .search-box{ position:relative; flex:1; min-width:180px; }
  .search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint); }
  .search-box input{ padding-left:32px; }
  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }

  /* Table */
  .table-wrap{ overflow-x:auto; }
  .data-table{ font-size:13px; }
  .data-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .data-table td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .data-table tr:last-child td{ border-bottom:none; }
  .team-cell-name{ font-weight:800; }
  .players-cell{ font-size:12px; color:var(--text-dim); line-height:1.5; }
  .players-cell .em{ color:var(--text-faint); }

  .pill{ display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:800; }
  .pill-active{ background:var(--success-bg); color:var(--success); }
  .pill-withdrawn{ background:var(--warning-bg); color:var(--warning); }
  .pill-disqualified{ background:var(--danger-bg); color:var(--danger); }

  .dots{ display:flex; gap:4px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--border); }
  .dot.done{ background:var(--success); }

  .status-select{ width:auto; padding:6px 8px; font-size:12px; font-weight:700; }

  .pagination{ display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .page-btn{ border:1px solid var(--border); background:var(--surface-strong); color:var(--text-dim); border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--font-mono); }
  .page-btn.active{ background:var(--accent2); color:#fff; border-color:transparent; }
  .page-btn[disabled]{ opacity:0.4; cursor:not-allowed; }
  .page-ellipsis{ color:var(--text-faint); padding:0 4px; }

  .empty-state{ text-align:center; padding:36px 16px; color:var(--text-dim); }
  .empty-state svg{ width:34px; height:34px; color:var(--text-faint); margin-bottom:10px; }

  /* Groups */
  .group-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .group-card{ padding:16px; }
  .group-card-header{ font-family:var(--font-display); font-size:18px; font-weight:800; margin-bottom:10px; }
  .standings-table th, .standings-table td{ padding:6px 8px; font-size:12.5px; }
  .qualify-row td{ background:var(--success-bg); }
  .qualify-row td:first-child{ border-radius:8px 0 0 8px; }
  .qualify-row td:last-child{ border-radius:0 8px 8px 0; }
  .rank-cell{ font-family:var(--font-mono); color:var(--text-faint); }
  .grp-matches{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .grp-match{ display:flex; align-items:center; gap:6px; font-size:12px; flex-wrap:wrap; padding:6px 8px; border-radius:8px; background:var(--surface-strong); }
  .grp-match.done{ opacity:0.75; }
  .grp-match-team{ flex:1; min-width:70px; font-weight:700; }
  .grp-vs{ color:var(--text-faint); }
  .score-input.sm{ width:48px; padding:5px 6px; text-align:center; }

  /* Bracket */
  .round-chips-wrap{ overflow-x:auto; margin-bottom:14px; }
  .round-chips{ display:flex; gap:6px; }
  .round-chip{ flex:none; border:1px solid var(--border); background:var(--surface-strong); color:var(--text-dim); padding:8px 14px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .round-chip.active{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .chip-count{ font-family:var(--font-mono); opacity:0.75; font-size:11px; }

  .match-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:14px; }

  .view-toggle{ display:flex; background:var(--surface-strong); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; flex:none; }
  .view-toggle button{ border:none; background:transparent; padding:8px 15px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--text-dim); }
  .view-toggle button.active{ background:var(--accent2); color:#fff; }

  .zoom-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .zoom-bar input[type="range"]{ width:150px; accent-color:var(--accent2); }
  .zoom-bar .zoom-label{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); min-width:44px; text-align:center; }
  .zoom-hint{ font-size:11.5px; color:var(--text-faint); }

  .bracket-scroll{ overflow:auto; max-height:72vh; padding:14px; background:var(--surface-strong); border:1px solid var(--border); border-radius:var(--radius-md); }
  .bracket-canvas{ position:relative; }
  .bracket-canvas .bracket-tree{ position:absolute; top:0; left:0; transform-origin:top left; }
  .bracket-tree{ display:flex; align-items:stretch; gap:56px; min-width:max-content; padding:6px 30px 6px 2px; }
  .round-col{ display:flex; flex-direction:column; min-width:236px; }
  .round-header{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-weight:800; margin-bottom:12px; text-align:center; }
  .round-body{ flex:1; display:flex; flex-direction:column; justify-content:space-around; }
  .pair{ position:relative; display:flex; flex-direction:column; gap:14px; }
  .pair::after{ content:''; position:absolute; right:-28px; top:37px; bottom:37px; width:0; border-right-style:solid; border-right-color:var(--line); border-right-width:var(--conn-w,2px); }
  .pair::before{ content:''; position:absolute; right:-28px; top:calc(50% - 1px); width:28px; height:0; border-top-style:solid; border-top-color:var(--line); border-top-width:var(--conn-w,2px); }
  .round-col:not(:last-child) .match-card::after{ content:''; position:absolute; right:-28px; top:calc(50% - 1px); width:28px; height:0; border-top-style:solid; border-top-color:var(--line); border-top-width:var(--conn-w,2px); }
  .final-wrap{ flex:1; display:flex; align-items:center; justify-content:center; }

  .match-card{ position:relative; width:236px; background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--line); border-radius:var(--radius-md); padding:9px 12px; }
  .match-card.mc-live{ border-left-color:var(--accent2); }
  .match-card.mc-done{ border-left-color:var(--success); }
  .match-card.mc-pending{ opacity:0.55; }
  .match-card[data-action]{ cursor:pointer; }
  .match-card.highlight{ box-shadow:0 0 0 2px var(--accent); }
  .mc-round-tag{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-weight:700; margin-bottom:6px; }
  .mc-team{ display:flex; align-items:center; gap:6px; padding:3px 0; font-size:13px; font-weight:700; }
  .mc-team.tbd{ color:var(--text-faint); font-weight:600; font-style:italic; }
  .mc-team.winner{ color:var(--success); }
  .mc-name-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .mc-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mc-score{ font-family:var(--font-mono); font-weight:700; }
  .tag{ font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:6px; text-transform:uppercase; }
  .tag-withdrawn{ background:var(--warning-bg); color:var(--warning); }
  .tag-dq{ background:var(--danger-bg); color:var(--danger); }
  .mc-editor{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:8px; }
  .mc-editor-scores{ display:flex; align-items:center; gap:8px; }
  .mc-vs{ color:var(--text-faint); font-size:11px; }
  .mc-editor-actions{ display:flex; flex-direction:column; gap:6px; }
  .wo-check{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim); }
  .wo-check input{ width:auto; }

  /* Rules drawer */
  .drawer-overlay{ position:fixed; inset:0; background:rgba(6,10,24,0.5); backdrop-filter:blur(2px); z-index:60; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }

<a href="dashboard.html" style="position:fixed;top:14px;left:14px;z-index:99;color:var(--text-dim);text-decoration:none;font-size:12px;letter-spacing:0.06em;border:1px solid var(--border);padding:6px 12px;border-radius:999px;background:var(--bg-elev);">&larr; DASHBOARD</a>

<div id="app"><div class="rb-loading">Memuat turnamen...</div></div>

<script>
(function(){
  "use strict";
  var app = document.getElementById('app');

  /* ---------------- ICONS ---------------- */
  /* Every icon carries explicit width/height attributes. Inline SVGs with only
     a viewBox (no intrinsic size) can collapse to 0x0 inside an inline-flex

  var ICONS = {
    shuttle: '<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="34" r="8" fill="var(--accent-solid)"/><path d="M24 26 L14 6 L24 12 L34 6 L24 26" fill="var(--accent2)" opacity="0.85"/></svg>',
    check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L9.5 18 L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    spinner: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="30 60"/></svg>',
    dot: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21 L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    book: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 5.5c0-1 1-1.5 2-1.5h6v16H6c-1 0-2 .5-2 1.5z" stroke="currentColor" stroke-width="1.8"/><path d="M20 5.5c0-1-1-1.5-2-1.5h-6v16h6c1 0 2 .5 2 1.5z" stroke="currentColor" stroke-width="1.8"/></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    empty: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 20V10l8-6 8 6v10a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6"/></svg>',
    user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4.4L15.6 5 19 8.4 8.4 19 4 20z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>'
  };

  /* ---------------- NAME / DUMMY DATA POOLS ---------------- */
  var FIRST_NAMES = ["Budi","Andi","Dedi","Rudi","Agus","Bambang","Joko","Wahyu","Dimas","Fajar","Rian","Yoga","Adit","Bayu","Fikri","Galih","Hendra","Irfan","Kevin","Lukman","Made","Nanda","Oscar","Putra","Reza","Satria","Taufik","Umar","Vino","Wisnu","Yusuf","Zaki","Ayu","Bella","Citra","Dian","Eka","Fitri","Gita","Hana","Indah","Julia","Kirana","Larasati","Maya","Nadia","Olivia","Putri","Rina","Sari","Tania","Utari","Vina","Wulan","Yuni","Zahra"];
  var LAST_NAMES = ["Saputra","Pratama","Wijaya","Kusuma","Santoso","Setiawan","Nugroho","Hidayat","Permana","Firmansyah","Gunawan","Hakim","Iswanto","Junaedi","Kurniawan","Lesmana","Mahendra","Nurdin","Octavian","Prasetyo","Rahman","Suryadi","Tanoto","Utomo","Wibowo","Yulianto","Zulkarnain"];
  var TEAM_WORD_A = ["Smash","Kilat","Garuda","Elang","Petir","Badai","Rajawali","Netra","Cakra","Baja","Angin","Komet","Falcon","Harimau","Naga","Drop","Rally","Cepat"];
  var TEAM_WORD_B = ["Jaya","Perkasa","Muda","Utama","Sakti","Prima","Nusantara","Abadi","Gemilang","Mandiri","Bersatu","Tangguh","Champion","Legenda","Unggul","Raya","Putra"];
  var EMAIL_DOMAINS = ["gmail.com","yahoo.com","outlook.com"];
  var teamComboCount = {};

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pick(arr){ return arr[randInt(0,arr.length-1)]; }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=randInt(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function randomPersonName(){ return pick(FIRST_NAMES) + " " + pick(LAST_NAMES); }
  function slugForEmail(name){ return name.toLowerCase().replace(/[^a-z\s]/g,'').trim().replace(/\s+/g,'.'); }
  function randomEmail(name){ return slugForEmail(name) + randInt(1,99) + "@" + pick(EMAIL_DOMAINS); }
  function randomTeamName(){
    var a = pick(TEAM_WORD_A), b = pick(TEAM_WORD_B);
    var combo = a+"-"+b;
    teamComboCount[combo] = (teamComboCount[combo]||0) + 1;
    var n = teamComboCount[combo];
    return n===1 ? (a+" "+b) : (a+" "+b+" "+n);
  }
  function uidFactory(){
    var c = 1;
    return function(prefix){ return prefix + "_" + (c++) + "_" + Math.random().toString(36).slice(2,7); };
  }
  var uid = uidFactory();

  function createDummyTeam(randomizeStatus){
    var p1 = randomPersonName(), p2 = randomPersonName();
    var fullVerified = Math.random() < 0.5;
    var partial = !fullVerified && Math.random() < 0.6;
    var checks = {
      dob: fullVerified || (partial && Math.random()<0.5),
      email: fullVerified || (partial && Math.random()<0.7),
      gopay: fullVerified || (partial && Math.random()<0.4),
      rekening: fullVerified || (partial && Math.random()<0.3)
    };
    var status = 'active';
    if(randomizeStatus!==false){
      var roll = Math.random();
      status = roll<0.88 ? 'active' : (roll<0.95 ? 'withdrawn' : 'disqualified');
    }
    return {
      id: uid('team'),
      name: randomTeamName(),
      subtitle: '',
      isDummy: true, // lets "Hapus Semua Tim Contoh" find and remove exactly these, and nothing else
      status: status,
      createdAt: Date.now(),
      players: [
        { name:p1, email: randomEmail(p1) },
        { name:p2, email: randomEmail(p2), partnerVerified: checks.email }
      ],
      checks: checks,
      dob:'', gopayNumber:'', bankName:'', bankAccount:''
    };
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function val(id){ var el = document.getElementById(id); return el ? el.value : ''; }

  /* ---------------- BRACKET ENGINE ---------------- */
  function nextPow2(n){ var p=1; while(p<n) p*=2; return Math.max(p,2); }
  function seedOrder(size){
    var seeds=[1];
    while(seeds.length<size){
      var s = seeds.length*2;
      var next=[];
      for(var i=0;i<seeds.length;i++){ next.push(seeds[i]); next.push(s+1-seeds[i]); }
      seeds = next;
    }
    return seeds;
  }
  function makeMatch(a,b){
    return { id: uid('m'), teamAId: a?a.id:null, teamBId: b?b.id:null, winnerId:null, scoreA:null, scoreB:null, walkover:false, isBye:false };
  }
  function generateKnockoutBracket(teams){
    var n = teams.length;
    var size = nextPow2(n);
    var order = seedOrder(size);
    var slots = order.map(function(seedNum){ return seedNum<=n ? teams[seedNum-1] : null; });
    var round0 = [];
    for(var i=0;i<slots.length;i+=2){
      var a = slots[i], b = slots[i+1];
      var m = makeMatch(a,b);
      if(a && !b){ m.winnerId = a.id; m.isBye = true; }
      if(b && !a){ m.winnerId = b.id; m.isBye = true; }
      round0.push(m);
    }
    var rounds = [round0];
    var prevCount = round0.length;
    while(prevCount>1){
      var r=[];
      for(var k=0;k<prevCount/2;k++) r.push(makeMatch(null,null));
      rounds.push(r);
      prevCount = r.length;
    }
    for(var ri=0; ri<rounds.length-1; ri++){
      for(var mi=0; mi<rounds[ri].length; mi++){
        var mm = rounds[ri][mi];
        if(mm.winnerId){
          var next = rounds[ri+1][Math.floor(mi/2)];
          if(mi%2===0) next.teamAId = mm.winnerId; else next.teamBId = mm.winnerId;
        }
      }
    }
    return { size:size, rounds:rounds };
  }
  function clearDownstream(bracket, r, i){
    var m = bracket.rounds[r][i];
    if(m.winnerId){
      m.winnerId=null; m.scoreA=null; m.scoreB=null; m.walkover=false;
      if(r+1 < bracket.rounds.length){
        var next = bracket.rounds[r+1][Math.floor(i/2)];
        var slot = (i%2===0) ? 'teamAId' : 'teamBId';
        next[slot] = null;
        clearDownstream(bracket, r+1, Math.floor(i/2));
      }
    }
  }
  function setMatchWinner(bracket, r, i, winnerId, walkover){
    var m = bracket.rounds[r][i];
    m.winnerId = winnerId;
    m.walkover = !!walkover;
    if(r+1 < bracket.rounds.length){
      var next = bracket.rounds[r+1][Math.floor(i/2)];
      var slot = (i%2===0) ? 'teamAId' : 'teamBId';
      if(next[slot] !== winnerId){
        next[slot] = winnerId;
        clearDownstream(bracket, r+1, Math.floor(i/2));
      }
    }
  }
  // Directly place (or replace, or clear) a team at one specific bracket slot -- unlike
  // setMatchWinner, this never requires the OTHER slot to be filled, never requires the previous
  // round to be complete, and works at any round including the final. That's the whole point:
  // "tambahin di titik manapun saat live atau tidak live ... langsung ke semi final atau final".
  // If the match this slot belongs to already had a winner declared, that result is no longer
  // meaningful once one of its two teams changes, so it (and anything that already advanced from
  // it) gets cleared the same way undoing a winner normally would.
  function assignSlotTeam(cat, r, i, side, teamId){
    var bracket = cat.bracket;
    if(!bracket || !bracket.rounds[r] || !bracket.rounds[r][i]) return;
    var m = bracket.rounds[r][i];
    var slotKey = side==='A' ? 'teamAId' : 'teamBId';
    var changed = m[slotKey] !== (teamId||null);
    m[slotKey] = teamId || null;
    m.isBye = false; // a manually-edited slot is never treated as an automatic bye anymore
    if(changed && m.winnerId) clearDownstream(bracket, r, i);
    queueCloudSync();
  }
  function handleWithdrawalInBracket(bracket, teamId){
    for(var r=0; r<bracket.rounds.length; r++){
      for(var i=0; i<bracket.rounds[r].length; i++){
        var m = bracket.rounds[r][i];
        if(m.teamAId===teamId || m.teamBId===teamId){
          var oppId = (m.teamAId===teamId) ? m.teamBId : m.teamAId;
          if(m.winnerId===teamId){
            if(oppId){ setMatchWinner(bracket, r, i, oppId, true); }
          } else if(!m.winnerId && oppId){
            setMatchWinner(bracket, r, i, oppId, true);
          }
        }
      }
    }
  }
  function allPairs(ids){
    var res=[];
    for(var i=0;i<ids.length;i++) for(var j=i+1;j<ids.length;j++) res.push([ids[i], ids[j]]);
    return res;
  }
  function assignGroups(cat){
    var activeTeams = cat.teams.filter(function(t){ return t.status==='active'; });
    var groupSize = cat.groupSize || 4;
    var numGroups = Math.max(1, Math.ceil(activeTeams.length / groupSize));
    var groups = [];
    for(var g=0; g<numGroups; g++) groups.push({ id: uid('grp'), name:'Grup '+(g+1), teamIds:[], matches:[] });
    var mixed = shuffle(activeTeams);
    mixed.forEach(function(t,i){ groups[i % numGroups].teamIds.push(t.id); });
    groups.forEach(function(g){
      g.matches = allPairs(g.teamIds).map(function(pair){
        return { id: uid('gm'), teamAId: pair[0], teamBId: pair[1], scoreA:null, scoreB:null, winnerId:null, walkover:false };
      });
    });
    cat.groups = groups;
    cat.groupsLocked = false;
    cat.bracket = null;
  }
  function computeStandings(g){
    var table = g.teamIds.map(function(id){ return { teamId:id, played:0, won:0, lost:0, pointsFor:0, pointsAgainst:0, pts:0 }; });
    function rowOf(id){ for(var i=0;i<table.length;i++) if(table[i].teamId===id) return table[i]; return null; }
    g.matches.forEach(function(m){
      if(m.winnerId==null) return;
      var a = rowOf(m.teamAId), b = rowOf(m.teamBId);
      if(!a||!b) return;
      a.played++; b.played++;
      if(m.scoreA!=null) a.pointsFor+=m.scoreA;
      if(m.scoreB!=null) a.pointsAgainst+=m.scoreB;
      if(m.scoreB!=null) b.pointsFor+=m.scoreB;
      if(m.scoreA!=null) b.pointsAgainst+=m.scoreA;
      if(m.winnerId===a.teamId){ a.won++; b.lost++; a.pts+=3; } else { b.won++; a.lost++; b.pts+=3; }
    });
    table.sort(function(x,y){
      if(y.pts!==x.pts) return y.pts-x.pts;
      var dx = x.pointsFor-x.pointsAgainst, dy = y.pointsFor-y.pointsAgainst;
      if(dy!==dx) return dy-dx;
      return y.pointsFor-x.pointsFor;
    });
    return table;
  }
  function handleWithdrawalInGroups(cat, teamId){
    if(!cat.groups) return;
    cat.groups.forEach(function(g){
      g.matches.forEach(function(m){
        if((m.teamAId===teamId || m.teamBId===teamId) && !m.winnerId){
          var opp = (m.teamAId===teamId) ? m.teamBId : m.teamAId;
          if(opp){ m.winnerId=opp; m.walkover=true; }
        }
      });
    });
  }
  function advanceGroupsToKnockout(cat){
    var advanceN = cat.advancePerGroup || 2;
    var perGroupTables = cat.groups.map(function(g){ return computeStandings(g); });
    var seededIds = [];
    for(var rank=0; rank<advanceN; rank++){
      var rankRow = [];
      perGroupTables.forEach(function(t){ if(t[rank]) rankRow.push(t[rank]); });
      if(rank%2===1) rankRow.reverse();
      rankRow.forEach(function(row){ seededIds.push(row.teamId); });
    }
    var teams = seededIds.map(function(id){ return cat.teams.filter(function(t){return t.id===id;})[0]; }).filter(Boolean);
    cat.bracket = generateKnockoutBracket(teams);
    cat.groupsLocked = true;
  }

  /* ---------------- CLOUD PERSISTENCE (Supabase) ----------------
     Two tables back this app (db/migrations/0028_tournaments.sql):
       - tournaments: one row, `data` jsonb = everything below EXCEPT the teams themselves
         (category format/settings/groups/bracket -- brackets/groups reference team ids, which
         stay stable because they ARE tournament_teams.id).
       - tournament_teams: one row per team, normalized out so RLS can let a non-admin insert
         (via the register_tournament_team RPC) / delete only their OWN row, without ever
         touching the shared tournament blob.
     The bracket-generation/scoring engine above (generateKnockoutBracket, setMatchWinner,
     assignGroups, computeStandings, ...) is untouched -- it still just reads/writes S.categories
     in memory; these functions only change where that state is loaded from / persisted to. */
  function serializeCategoriesForCloud(){
    // Strip `teams` out of each category before persisting -- those live in tournament_teams,
    // not in the tournament's jsonb blob.
    return S.categories.map(function(c){
      return {
        id: c.id, name: c.name, format: c.format, groupSize: c.groupSize,
        advancePerGroup: c.advancePerGroup, groups: c.groups, groupsLocked: c.groupsLocked,
        bracket: c.bracket, sample: c.sample
      };
    });
  }
  var cloudSyncTimer = null;
  function queueCloudSync(){
    if(!S.isAdmin || !S.tournamentId) return; // only admins own the tournament row; RLS would reject anyway
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(async function(){
      try{
        await supabase.from('tournaments').update({
          name: S.tournamentName,
          data: { rulesText: S.rulesText, categories: serializeCategoriesForCloud() }
        }).eq('id', S.tournamentId);
      }catch(e){ console.warn('Cloud sync skip:', e.message); }
    }, 900);
  }

  function teamRowToTeam(row){
    var p = row.payload || {};
    return {
      id: row.id,
      name: row.name,
      subtitle: p.subtitle || '',
      isDummy: !!p.isDummy,
      manualSeed: !!p.manualSeed,
      status: p.status || 'active',
      createdAt: row.created_at ? Date.parse(row.created_at) : Date.now(),
      players: p.players || [{name:'',email:''},{name:'',email:''}],
      checks: p.checks || { dob:false, email:false, gopay:false, rekening:false },
      dob: p.dob||'', gopayNumber: p.gopayNumber||'', bankName: p.bankName||'', bankAccount: p.bankAccount||'',
      registeredBy: row.registered_by,
      categoryId: row.category_id
    };
  }
  function teamToPayload(t){
    return {
      status: t.status, players: t.players, checks: t.checks,
      dob: t.dob, gopayNumber: t.gopayNumber, bankName: t.bankName, bankAccount: t.bankAccount,
      subtitle: t.subtitle || '', isDummy: !!t.isDummy, manualSeed: !!t.manualSeed
    };
  }
  // Admin-only direct writes (dummy teams, manual add, status change, delete) -- a non-admin
  // never calls these; their writes go through registerTeamCloud()/withdrawTeamCloud() instead,
  // which is all RLS allows them to do anyway.
  async function createTeamRowAdmin(catId, team){
    try{
      var res = await supabase.from('tournament_teams').insert({
        tournament_id: S.tournamentId, category_id: catId, name: team.name, payload: teamToPayload(team)
      }).select().single();
      if(res.error) throw res.error;
      team.id = res.data.id;
      return team;
    }catch(e){
      toast('Gagal menyimpan tim: '+e.message, 'error');
      return null;
    }
  }
  async function bulkCreateDummyTeams(cat, n){
    // Used by the admin "Data Contoh" panel to preview the UI at scale. Batched into a single
    // insert (rather than n sequential round-trips) since n can be up to 4000.
    var drafts = [];
    for(var i=0;i<n;i++) drafts.push(createDummyTeam());
    var rows = drafts.map(function(t){
      return { tournament_id: S.tournamentId, category_id: cat.id, name: t.name, payload: teamToPayload(t) };
    });
    try{
      var res = await supabase.from('tournament_teams').insert(rows).select();
      if(res.error) throw res.error;
      res.data.forEach(function(row){ cat.teams.push(teamRowToTeam(row)); });
      toast(n+' tim contoh ditambahkan');
    }catch(e){
      toast('Gagal menambah tim contoh: '+e.message, 'error');
    }
    render();
  }

  async function registerTeamCloud(catId, name, payload){

    });

  async function withdrawTeamCloud(teamId){

  async function loadTournamentTeams(){
    var res = await supabase.from('tournament_teams').select('*').eq('tournament_id', S.tournamentId);
    if(res.error){ console.warn('Load teams failed:', res.error.message); return; }
    var rows = res.data || [];
    S.categories.forEach(function(c){ c.teams = []; });
    S.ui.myTeamIds = [];
    rows.forEach(function(row){
      var cat = S.categories.filter(function(c){ return c.id===row.category_id; })[0];
      if(!cat) return; // team belongs to a category that no longer exists locally
      var team = teamRowToTeam(row);
      cat.teams.push(team);
      if(team.registeredBy && team.registeredBy===S.currentUserId) S.ui.myTeamIds.push(team.id);
    });
  }
  async function loadTournament(){
    var res = await supabase.from('tournaments').select('*').order('created_at', { ascending:false }).limit(1).maybeSingle();
    if(res.error){ console.warn('Load tournament failed:', res.error.message); return false; }
    if(!res.data) return false;
    var row = res.data;
    S.tournamentId = row.id;
    S.tournamentName = row.name;
    S.registrationOpen = !!row.registration_open;
    var data = row.data || {};
    S.rulesText = data.rulesText || S.rulesText;
    S.categories = (data.categories || []).map(function(c){ c.teams = []; return c; });
    S.activeCategoryId = S.categories.length ? S.categories[0].id : null;
    await loadTournamentTeams();
    return true;
  }
  async function createTournamentAdmin(name){
    var res = await supabase.from('tournaments').insert({
      name: name || 'Turnamen Baru', created_by: S.currentUserId, registration_open: false,
      data: { rulesText: S.rulesText, categories: [] }
    }).select().single();
    if(res.error){ toast('Gagal membuat turnamen: '+res.error.message, 'error'); return false; }
    S.tournamentId = res.data.id;
    S.tournamentName = res.data.name;
    S.registrationOpen = false;
    S.categories = [];
    S.activeCategoryId = null;
    return true;

  var realtimeChannel = null;
  function subscribeRealtime(){
    if(realtimeChannel) return;
    realtimeChannel = supabase.channel('tournament_sync_'+S.tournamentId)
      .on('postgres_changes', { event:'*', schema:'public', table:'tournaments', filter:'id=eq.'+S.tournamentId }, async function(){
        var wasAdmin = S.isAdmin;
        await loadTournament();
        S.isAdmin = wasAdmin; // loadTournament doesn't touch role
        if(!S.categories.some(function(c){ return c.id===S.activeCategoryId; })) S.activeCategoryId = S.categories[0] ? S.categories[0].id : null;
        render();
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'tournament_teams', filter:'tournament_id=eq.'+S.tournamentId }, async function(){
        await loadTournamentTeams();
        render();
      })
      .subscribe();
  }

  /* ---------------- ARCHIVE TO PDF ----------------
     No backend, so "export as PDF" means: render a clean, print-only
     summary (champion, group standings, full bracket) into a hidden node,
     then call window.print() so the browser's own "Save as PDF" produces
     the file. @media print (see CSS) hides the live app and shows only
     this node while printing. */
  var archiveEl = null;
  function ensureArchiveEl(){
    if(!archiveEl){
      archiveEl = document.createElement('div');
      archiveEl.className = 'archive-doc';
      document.body.appendChild(archiveEl);
    }
    return archiveEl;
  }
  function buildArchiveHTML(cat){
    var dateStr = new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
    var fmtLabel = cat.format==='groups' ? 'Grup lalu Gugur' : 'Langsung Gugur';
    var html = '<div class="archive-header">' +
      '<div class="archive-brand">Rally Bracket &middot; Arsip Turnamen</div>' +
      '<h1>'+escapeHtml(cat.name)+'</h1>' +
      '<div class="archive-meta">Format: '+fmtLabel+' &middot; Diarsipkan: '+dateStr+' &middot; Total tim terdaftar: '+cat.teams.length+'</div>' +
      '</div>';

    var champion=null, runnerUp=null, decided=false;
    if(cat.bracket && cat.bracket.rounds && cat.bracket.rounds.length){
      var finalMatch = cat.bracket.rounds[cat.bracket.rounds.length-1][0];
      if(finalMatch && finalMatch.winnerId){
        decided = true;
        champion = teamById(cat, finalMatch.winnerId);
        var loserId = finalMatch.winnerId===finalMatch.teamAId ? finalMatch.teamBId : finalMatch.teamAId;
        runnerUp = teamById(cat, loserId);
      }
    }
    if(decided && champion){
      html += '<div class="archive-champion">' +
        '<div class="archive-champion-label">JUARA</div>' +
        '<div class="archive-champion-name">'+escapeHtml(champion.name)+'</div>' +
        '<div class="archive-champion-players">'+champion.players.map(function(p){return escapeHtml(p.name);}).join(' &amp; ')+'</div>' +
        (runnerUp ? '<div class="archive-runner">Runner-up: '+escapeHtml(runnerUp.name)+(runnerUp.players?' ('+runnerUp.players.map(function(p){return escapeHtml(p.name);}).join(' &amp; ')+')':'')+'</div>' : '') +
        '</div>';
    } else {
      html += '<div class="archive-note">Turnamen ini belum memiliki juara final &mdash; arsip berikut adalah cuplikan hasil sejauh ini.</div>';
    }

    if(cat.format==='groups' && cat.groups && cat.groups.length){
      html += '<h2 class="archive-section-title">Klasemen Grup</h2>';
      cat.groups.forEach(function(g){
        var table = computeStandings(g);
        html += '<div class="archive-group"><h3>'+escapeHtml(g.name)+'</h3>' +
          '<table class="archive-table"><thead><tr><th>Tim</th><th>M</th><th>W</th><th>L</th><th>Selisih</th><th>Poin</th></tr></thead><tbody>' +
          table.map(function(row){
            var t = teamById(cat, row.teamId);
            return '<tr><td>'+escapeHtml(t?t.name:'-')+'</td><td>'+row.played+'</td><td>'+row.won+'</td><td>'+row.lost+'</td><td>'+(row.pointsFor-row.pointsAgainst)+'</td><td>'+row.pts+'</td></tr>';
          }).join('') +
          '</tbody></table></div>';
      });
    }

    if(cat.bracket && cat.bracket.rounds && cat.bracket.rounds.length){
      html += '<h2 class="archive-section-title">Bagan Gugur</h2>';
      cat.bracket.rounds.forEach(function(round, r){
        var isFinal = r===cat.bracket.rounds.length-1;
        html += '<div class="archive-round"><h3>'+(isFinal?'Final':'Babak '+(r+1))+'</h3><div class="archive-matches">';
        round.forEach(function(m){
          var a = teamById(cat, m.teamAId), b = teamById(cat, m.teamBId);
          var aName = a ? escapeHtml(a.name) : (m.isBye?'&mdash;':'TBD');
          var bName = b ? escapeHtml(b.name) : (m.isBye?'&mdash;':'TBD');
          var aWin = !!(m.winnerId && m.winnerId===m.teamAId);
          var bWin = !!(m.winnerId && m.winnerId===m.teamBId);
          var scoreStr = (m.scoreA!=null && m.scoreB!=null) ? (m.scoreA+' - '+m.scoreB) : (m.walkover ? 'W.O.' : (m.isBye ? 'BYE' : 'vs'));
          html += '<div class="archive-match">' +
            '<span class="'+(aWin?'archive-winner':'')+'">'+aName+'</span>' +
            '<span class="archive-score">'+scoreStr+'</span>' +
            '<span class="'+(bWin?'archive-winner':'')+'">'+bName+'</span>' +
            '</div>';
        });
        html += '</div></div>';
      });
    } else if(!(cat.format==='groups' && cat.groups && cat.groups.length)){
      html += '<div class="archive-note">Bagan belum dibuat untuk kategori ini.</div>';
    }

    html += '<div class="archive-footer">Dibuat dengan Rally Bracket &middot; '+dateStr+'</div>';
    return html;
  }

  var toastStack = null;
  function ensureToastStack(){
    if(!toastStack){
      toastStack = document.createElement('div');
      toastStack.className = 'toast-stack';
      document.body.appendChild(toastStack);
    }
    return toastStack;

  function toast(msg, type){
    // Appends directly to a persistent DOM node instead of going through the
    // main state render, so a toast never wipes out uncontrolled form inputs
    // (e.g. the registration form) that a full render() would reset.
    var stack = ensureToastStack();
    var t = document.createElement('div');
    t.className = 'toast ' + (type||'success');
    t.innerHTML = (type==='error'?ICONS.close:ICONS.check) + ' ' + escapeHtml(msg);
    stack.appendChild(t);

  function setTeamStatus(catId, teamId, newStatus){
    var cat = S.categories.filter(function(c){return c.id===catId;})[0];

    var team = teamById(cat, teamId);

    var prev = team.status;

      if(cat.groups && !cat.groupsLocked) handleWithdrawalInGroups(cat, teamId);

    if(S.isAdmin){

  }

  /* ---------------- SHARED RENDER HELPERS ---------------- */
  function teamStatusTag(team){
    if(!team) return '';
    if(team.status==='withdrawn') return '<span class="tag tag-withdrawn">Mundur</span>';

  function renderPagination(current,total,action,extra){
    if(total<=1) return '';
    var pages=[];
    for(var p=1;p<=total;p++){
      if(p===1||p===total||Math.abs(p-current)<=1) pages.push(p);
      else if(pages[pages.length-1]!=='...') pages.push('...');
    }
    var ex = extra || '';
    var btns = pages.map(function(p){
      if(p==='...') return '<span class="page-ellipsis">…</span>';
      return '<button class="page-btn '+(p===current?'active':'')+'" data-action="'+action+'" data-page="'+p+'" '+ex+'>'+p+'</button>';
    }).join('');
    var prevDisabled = current===1 ? 'disabled' : '';
    var nextDisabled = current===total ? 'disabled' : '';
    return '<div class="pagination">' +
      '<button class="page-btn" data-action="'+action+'" data-page="'+Math.max(1,current-1)+'" '+ex+' '+prevDisabled+'>‹</button>' +
      btns +
      '<button class="page-btn" data-action="'+action+'" data-page="'+Math.min(total,current+1)+'" '+ex+' '+nextDisabled+'>›</button>' +
      '</div>';
  }
  function matchCardHTML(cat, bracket, r, i, editable, searchTerm){
    var m = bracket.rounds[r][i];
    var teamA = teamById(cat, m.teamAId);
    var teamB = teamById(cat, m.teamBId);
    var isFinal = r===bracket.rounds.length-1;
    var pending = !teamA || !teamB;
    var stateClass = pending ? 'mc-pending' : (m.winnerId ? 'mc-done' : 'mc-live');
    var matchKey = r+'-'+i;
    var isOpen = S.ui.openMatch===matchKey;
    var highlight = false;
    if(searchTerm){
      var q = searchTerm.toLowerCase();
      if((teamA && teamA.name.toLowerCase().indexOf(q)>=0) || (teamB && teamB.name.toLowerCase().indexOf(q)>=0)) highlight = true;
    }
    // Every slot (filled, TBD, or a bye) is clickable in edit mode -- this is what lets an admin
    // place/replace a team at ANY round, including deep into the bracket (e.g. straight into a
    // semifinal or final) and whether the tournament is already live or not. Kept separate from
    // the "open match editor" click on the whole card (which needs both slots filled and isn't a
    // bye) -- clicking a name always means "edit this slot's team", clicking elsewhere on an
    // eligible card means "score this match".
    function rowHtml(team, isWinner, score, side){

    html += '<div class="mc-round-tag">'+(isFinal?'Final':'Babak '+(r+1))+(m.isBye?' · BYE':'')+(m.walkover?' · W.O.':'')+'</div>';
    html += rowHtml(teamA, m.winnerId && m.winnerId===m.teamAId, m.scoreA, 'A');
    html += rowHtml(teamB, m.winnerId && m.winnerId===m.teamBId, m.scoreB, 'B');

        '<input type="number" min="0" id="scoreB_'+matchKey+'" class="score-input mono" placeholder="Skor" value="'+(m.scoreB!=null?m.scoreB:'')+'">' +
        '</div>' +
        '<label class="wo-check"><input type="checkbox" id="woCheck_'+matchKey+'"> Menang W.O. (lawan tidak hadir)</label>' +
        '<div class="mc-editor-actions">' +
        '<button class="btn btn-sm btn-primary" data-action="declare-winner" data-round="'+r+'" data-idx="'+i+'" data-winner="A">'+escapeHtml(teamA.name)+' Menang</button>' +
        '<button class="btn btn-sm btn-primary" data-action="declare-winner" data-round="'+r+'" data-idx="'+i+'" data-winner="B">'+escapeHtml(teamB.name)+' Menang</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="close-match-editor">Tutup</button>' +

  function renderBracketTree(cat, editable, searchTerm){
    var bracket = cat.bracket;
    var cols = bracket.rounds.map(function(round, r){
      var isLast = r===bracket.rounds.length-1;
      var inner;
      if(!isLast){
        var pairsHtml = '';
        for(var i=0;i<round.length;i+=2){
          pairsHtml += '<div class="pair">' + matchCardHTML(cat,bracket,r,i,editable,searchTerm) + (round[i+1]?matchCardHTML(cat,bracket,r,i+1,editable,searchTerm):'') + '</div>';
        }
        inner = pairsHtml;
      } else {
        inner = '<div class="final-wrap">'+matchCardHTML(cat,bracket,r,0,editable,searchTerm)+'</div>';
      }
      return '<div class="round-col"><div class="round-header">'+(isLast?'Final':'Babak '+(r+1))+'</div><div class="round-body">'+inner+'</div></div>';
    }).join('');
    return '<div class="bracket-scroll"><div class="bracket-canvas" data-cat="'+cat.id+'"><div class="bracket-tree">'+cols+'</div></div></div>';
  }
  function renderBracketPaged(cat, editable, searchTerm){
    var bracket = cat.bracket;
    var roundIdx = S.ui.bracketRound[cat.id] || 0;
    if(roundIdx >= bracket.rounds.length) roundIdx = 0;
    var round = bracket.rounds[roundIdx];
    var chips = bracket.rounds.map(function(rnd,r){
      return '<button class="round-chip '+(r===roundIdx?'active':'')+'" data-action="round-select" data-round="'+r+'">'+
        (r===bracket.rounds.length-1?'Final':'Babak '+(r+1))+' <span class="chip-count">'+rnd.length+'</span></button>';
    }).join('');
    var perPage = 12;
    var page = S.ui.bracketPage[cat.id] || 1;
    var totalPages = Math.max(1, Math.ceil(round.length/perPage));
    if(page>totalPages) page = totalPages;
    var start = (page-1)*perPage;
    var items = round.slice(start, start+perPage).map(function(m,localI){ return matchCardHTML(cat,bracket,roundIdx,start+localI,editable,searchTerm); }).join('');
    return '<div class="round-chips-wrap"><div class="round-chips">'+chips+'</div></div>' +
      '<div class="match-grid">'+items+'</div>' +
      renderPagination(page,totalPages,'bracket-page');
  }

  /* ---------------- BRACKET ZOOM ("PETA") ----------------
     The tree is rendered once at its natural (unscaled) size, then visually
     scaled with CSS transform. transform alone doesn't affect layout/scroll
     size, so the canvas wrapper's own width/height are set explicitly (in
     JS, from a measurement) to the scaled dimensions - that's what makes the
     scrollable area match what's visually shown at any zoom level. */
  function clampZoom(z){ return Math.max(2, Math.min(150, Math.round(z))); }
  function findBracketCanvas(cat){ return document.querySelector('.bracket-canvas[data-cat="'+cat.id+'"]'); }
  function applyZoomStyle(cat, zoomPct){
    var canvas = findBracketCanvas(cat);
    if(!canvas) return;
    var tree = canvas.querySelector('.bracket-tree');
    if(!tree) return;
    var scroll = canvas.parentElement;
    tree.style.transform = 'none';
    var natW = tree.offsetWidth, natH = tree.offsetHeight;
    var zoom = zoomPct/100;
    tree.style.transform = 'scale('+zoom+')';
    // Connector lines are drawn with CSS borders on elements inside the
    // scaled tree, so their pixel width shrinks along with everything else -
    // at a few % zoom a 2px line becomes sub-pixel and disappears, leaving
    // just scattered card-dots with no visible branching shape. Compensate
    // by inflating the border width before scaling so it always renders at
    // a constant, clearly-visible thickness: this is what makes the "whole
    // map" view actually read as a tapering tree/mountain silhouette instead
    // of noise.
    var connW = Math.min(160, 1.8/zoom);
    tree.style.setProperty('--conn-w', connW.toFixed(2)+'px');
    var scaledW = Math.ceil(natW*zoom), scaledH = Math.ceil(natH*zoom);
    canvas.style.width = scaledW+'px';
    canvas.style.height = scaledH+'px';
    // Center small/zoomed-out content in the scroll viewport instead of
    // leaving it pinned in the top-left corner of a lot of empty space.
    var availW = scroll.clientWidth, availH = scroll.clientHeight;
    canvas.style.marginLeft = scaledW < availW ? Math.floor((availW-scaledW)/2)+'px' : '0';
    canvas.style.marginTop = scaledH < availH ? Math.floor((availH-scaledH)/2)+'px' : '0';
  }
  // Practical default: fill the available width (never zooms in past 100% on
  // its own). A big bracket still needs vertical scrolling at this zoom, but
  // every match card stays legible instead of shrinking to an invisible dot.
  function computeFitZoom(cat){
    var canvas = findBracketCanvas(cat);
    if(!canvas) return 100;
    var tree = canvas.querySelector('.bracket-tree');
    if(!tree) return 100;
    var scroll = canvas.parentElement;
    tree.style.transform = 'none';
    var natW = tree.offsetWidth;
    if(!natW) return 100;
    var availW = Math.max(160, scroll.clientWidth - 28);
    return clampZoom(Math.min(availW/natW, 1) * 100);
  }
  // The "whole map" view: zooms out enough that BOTH dimensions fit on
  // screen at once, so a big draw reads as one small branching shape - the
  // "see the whole mountain from far away" effect - instead of a normal,
  // scrollable working view.
  function computeWholeMapZoom(cat){
    var canvas = findBracketCanvas(cat);
    if(!canvas) return 100;
    var tree = canvas.querySelector('.bracket-tree');
    if(!tree) return 100;
    var scroll = canvas.parentElement;
    tree.style.transform = 'none';
    var natW = tree.offsetWidth, natH = tree.offsetHeight;
    if(!natW || !natH) return 100;
    var availW = Math.max(160, scroll.clientWidth - 28);
    var availH = Math.max(220, scroll.clientHeight - 28);
    var pct = Math.min(availW/natW, availH/natH, 1) * 100;
    // Fitting a huge single-elimination tree into both dimensions at once can
    // mathematically demand a tiny percentage (a 512-leaf bracket is ~17x
    // taller than it is wide) - below a certain point the branching pattern
    // that makes this view interesting stops being visible at all and it's
    // just a hairline. Floor it so the "whole map" always shows a
    // recognizable tapering shape, even if that means a little scrolling
    // for very large brackets instead of a perfect one-screen fit.
    return clampZoom(Math.max(pct, 6));
  }
  function updateZoomUI(z){
    var slider = document.getElementById('zoomSlider'); if(slider) slider.value = z;
    var label = document.getElementById('zoomLabel'); if(label) label.textContent = z+'%';
  }
  function layoutBracketZoom(cat){
    var mode = S.ui.bracketMode[cat.id] || 'peta';
    if(mode !== 'peta') return;
    var canvas = findBracketCanvas(cat);
    if(!canvas) return;
    if(S.ui.bracketZoom[cat.id] == null){
      S.ui.bracketZoom[cat.id] = computeFitZoom(cat);
    }
    applyZoomStyle(cat, S.ui.bracketZoom[cat.id]);
    if(S.ui.bracketScrollTo){
      var target = document.getElementById('matchcard_'+S.ui.bracketScrollTo);
      if(target && target.scrollIntoView) target.scrollIntoView({ block:'center', inline:'center' });
      S.ui.bracketScrollTo = null;
    }
  }

  function groupCardHTML(cat, g){
    var table = computeStandings(g);
    var rows = table.map(function(row, idx){
      var team = teamById(cat, row.teamId);
      return '<tr class="'+(idx<cat.advancePerGroup?'qualify-row':'')+'">' +
        '<td class="rank-cell mono">'+(idx+1)+'</td>' +
        '<td>'+escapeHtml(team?team.name:'?')+' '+teamStatusTag(team)+'</td>' +
        '<td class="mono">'+row.played+'</td><td class="mono">'+row.won+'</td><td class="mono">'+row.lost+'</td>' +
        '<td class="mono">'+(row.pointsFor-row.pointsAgainst)+'</td><td class="mono">'+row.pts+'</td></tr>';
    }).join('');
    var matches = g.matches.map(function(m){
      var teamA = teamById(cat,m.teamAId), teamB = teamById(cat,m.teamBId);
      return '<div class="grp-match '+(m.winnerId?'done':'')+'">' +
        '<span class="grp-match-team">'+escapeHtml(teamA?teamA.name:'?')+'</span>' +
        '<input type="number" min="0" class="score-input sm mono" id="gs_a_'+m.id+'" value="'+(m.scoreA!=null?m.scoreA:'')+'" '+(cat.groupsLocked?'disabled':'')+'>' +
        '<span class="grp-vs">–</span>' +
        '<input type="number" min="0" class="score-input sm mono" id="gs_b_'+m.id+'" value="'+(m.scoreB!=null?m.scoreB:'')+'" '+(cat.groupsLocked?'disabled':'')+'>' +
        '<span class="grp-match-team">'+escapeHtml(teamB?teamB.name:'?')+'</span>' +
        (!cat.groupsLocked ? '<button class="btn btn-sm btn-ghost" data-action="save-group-match" data-group="'+g.id+'" data-match="'+m.id+'">Simpan</button>' : (m.walkover?'<span class="tag tag-warning">W.O.</span>':'')) +
        '</div>';
    }).join('');
    return '<div class="panel group-card"><div class="group-card-header">'+escapeHtml(g.name)+'</div>' +
      '<div class="table-wrap"><table class="standings-table"><thead><tr><th>#</th><th>Tim</th><th>M</th><th>W</th><th>L</th><th>Sel.</th><th>Poin</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
      '<div class="grp-matches">'+matches+'</div></div>';
  }

  // "Place a team at this slot" modal -- reachable by clicking ANY team name in the bracket while
  // editing (TBD, filled, or a bye; any round). Either types a brand-new team on the spot (with
  // an optional subtitle line, e.g. player names or a note shown under the team name) or picks an
  // existing registered-but-not-yet-placed team from this category.
  function renderSlotEditorModal(){
    var ed = S.ui.slotEditor;
    if(!ed) return '';
    var cat = getCat();
    var bracket = cat && cat.bracket;
    if(!bracket || !bracket.rounds[ed.r] || !bracket.rounds[ed.r][ed.i]){
      // Bracket changed shape (e.g. another admin reset it) while this editor was open --
      // silently drop the stale reference instead of throwing on the next render.
      S.ui.slotEditor = null;
      return '';
    }
    var m = bracket.rounds[ed.r][ed.i];
    var currentId = ed.side==='A' ? m.teamAId : m.teamBId;
    var current = teamById(cat, currentId);
    var placedIds = {};
    bracket.rounds.forEach(function(round){ round.forEach(function(mm){ if(mm.teamAId) placedIds[mm.teamAId]=1; if(mm.teamBId) placedIds[mm.teamBId]=1; }); });
    var pickable = cat.teams.filter(function(t){ return t.id===currentId || !placedIds[t.id]; });
    var roundLabel = ed.r===bracket.rounds.length-1 ? 'Final' : 'Babak '+(ed.r+1);
    return '<div class="modal-overlay"><div class="slot-editor-box">' +
      '<h3 style="font-size:18px;margin-bottom:4px;">Atur Slot Tim</h3>' +
      '<div class="hint" style="margin-bottom:16px;">'+roundLabel+' &middot; slot '+(ed.side==='A'?'1':'2')+(current?' &middot; saat ini: '+escapeHtml(current.name):'')+'</div>' +
      (pickable.length ? '<div class="field"><label for="slotExistingTeamSelect">Pilih tim terdaftar</label>' +
        '<select id="slotExistingTeamSelect"><option value="">-- ketik tim baru di bawah --</option>' +
        pickable.map(function(t){ return '<option value="'+t.id+'" '+(t.id===currentId?'selected':'')+'>'+escapeHtml(t.name)+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="slot-editor-divider">atau</div>' : '') +
      '<div class="field"><label for="slotTeamNameInput">Nama tim baru</label><input type="text" id="slotTeamNameInput" placeholder="cth: Tim Wildcard"></div>' +
      '<div class="field"><label for="slotTeamSubtitleInput">Nama tambahan (opsional, tampil di bawah nama tim)</label><input type="text" id="slotTeamSubtitleInput" placeholder="cth: nama pemain, catatan"></div>' +
      '<div class="confirm-actions" style="justify-content:space-between;">' +
      (current ? '<button class="btn btn-ghost" data-action="clear-slot">Kosongkan Slot</button>' : '<span></span>') +
      '<div class="field-inline" style="margin:0;"><button class="btn btn-ghost" data-action="close-slot-editor">Batal</button><button class="btn btn-primary" data-action="save-slot-editor">Simpan</button></div>' +
      '</div></div></div>';
  }
  async function submitSlotEditor(){
    var ed = S.ui.slotEditor;
    if(!ed) return;
    var cat = getCat();
    var existingSel = document.getElementById('slotExistingTeamSelect');
    var pickedId = existingSel ? existingSel.value : '';
    var teamId;
    if(pickedId){
      teamId = pickedId;
    } else {
      var name = val('slotTeamNameInput').trim();
      if(!name){ toast('Isi nama tim, atau pilih dari tim terdaftar.', 'error'); return; }
      var subtitle = val('slotTeamSubtitleInput').trim();
      var newTeam = {
        name: name, subtitle: subtitle, status:'active',
        players:[{name:'',email:''},{name:'',email:''}],
        checks:{dob:false,email:false,gopay:false,rekening:false},
        dob:'', gopayNumber:'', bankName:'', bankAccount:'',
        manualSeed:true, isDummy:false
      };
      var saved = await createTeamRowAdmin(cat.id, newTeam);
      if(!saved) return; // createTeamRowAdmin already toasted the error
      cat.teams.push(saved);
      teamId = saved.id;
    }
    assignSlotTeam(cat, ed.r, ed.i, ed.side, teamId);
    S.ui.slotEditor = null;
    toast('Tim ditempatkan di slot.');
    render();
  }

  function renderApp(){

        renderRulesDrawer() + renderConfirmModal();

  function render(){
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = active && ('selectionStart' in active) ? active.selectionStart : null;
    var selEnd = active && ('selectionEnd' in active) ? active.selectionEnd : null;
    app.innerHTML = renderApp();
    if(activeId){
      var el = document.getElementById(activeId);
      if(el){
        el.focus();
        if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
    var curCat = getCat();
    if(curCat && curCat.bracket){
      var showingBagan = (S.isAdmin && S.ui.adminTab==='bagan') || (!S.isAdmin && S.ui.playerTab==='bagan');
      if(showingBagan) layoutBracketZoom(curCat);
    }
  }

  function updateRegStatusBar(){
    var bar = document.getElementById('regStatusBar');
