name: Deploy Prod

# Static site (no build step) -- deploy is a release-folder + symlink swap on
# the VPS, not Docker/blue-green. Every push to prod:
#   1. Backs up the DB (pg_dump) and the previous release's source code.
#   2. Ships the new code into a fresh, timestamped release folder.
#   3. Swaps the /var/www/gembel.store symlink to it and reloads nginx.
#   4. Prunes old release folders, keeping the last 5 for instant rollback.
#
# Rollback (no rebuild needed, just re-point the symlink):
#   ssh <user>@<vps> "ls -1t /var/www/releases"                 # pick one
#   ssh <user>@<vps> "ln -sfn /var/www/releases/<pick> /var/www/gembel.store && sudo systemctl reload nginx"

on:
  push:
    branches:
      - prod

env:
  RELEASE_ROOT: /var/www/releases
  LIVE_LINK: /var/www/gembel.store
  KEEP_RELEASES: 5

jobs:
  deploy-prod:
    name: Backup & Deploy to Prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Backup Database & Previous Release
        run: |
          mkdir -p ./backups

          PREV_HASH=$(git rev-parse --short HEAD~1 2>/dev/null || git rev-parse --short HEAD)
          PREV_DATE=$(git log -1 --format="%ad" --date=format:'%Y%m%d' HEAD~1 2>/dev/null || date +%Y%m%d)

          SQL_FILE="gembelsql.v$PREV_DATE-$PREV_HASH.sql"
          SRC_FILE="gembelsrc.v$PREV_DATE-$PREV_HASH.tar"

          # Kutip tunggal (') biar password dengan simbol aman dari shell bash
          docker run --rm postgres:17 pg_dump '${{ secrets.SUPABASE_DB_URL }}' > ./backups/$SQL_FILE
          tar -cf ./backups/$SRC_FILE --exclude=./backups --exclude=.git .

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "mkdir -p /home/irwanto/backups/"
          scp ./backups/$SQL_FILE ./backups/$SRC_FILE ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/home/irwanto/backups/

      - name: Ship New Release
        run: |
          STAMP=$(date +%Y%m%d-%H%M%S)
          RELEASE_DIR="${{ env.RELEASE_ROOT }}/$STAMP"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "mkdir -p $RELEASE_DIR"

          rsync -az --delete \
            --exclude='.git' --exclude='backups' --exclude='db/.env' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:$RELEASE_DIR/

      - name: Switch Live Symlink & Reload Nginx
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << EOF
            set -e
            ln -sfn "$RELEASE_DIR" "${{ env.LIVE_LINK }}"
            sudo systemctl reload nginx

            echo "Pruning old releases, keeping last ${{ env.KEEP_RELEASES }}..."
            cd "${{ env.RELEASE_ROOT }}"
            ls -1t | tail -n +$(( ${{ env.KEEP_RELEASES }} + 1 )) | xargs -r rm -rf

            echo "Live release: $RELEASE_DIR"
          EOF
